  <style>
:root {
  color-scheme: light;
  --bg-0: #eafcff;
  --bg-1: #d5f6fb;
  --bg-2: #bdebf4;
  --surface: rgba(255,255,255,.88);
  --surface-strong: #ffffff;
  --surface-soft: rgba(255,255,255,.68);
  --ink: #0b2f45;
  --ink-soft: #5d7788;
  --line: rgba(9,94,119,.14);
  --brand: #0798aa;
  --brand-strong: #057b92;
  --brand-dark: #063e5a;
  --brand-faint: rgba(7,152,170,.11);
  --accent: #34c7d5;
  --danger: #c34459;
  --warning: #bf7b24;
  --success: #168565;
  --shadow: 0 24px 70px rgba(7,66,87,.18);
  --shadow-soft: 0 12px 32px rgba(7,66,87,.12);
  --radius-xl: 30px;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { width: 100%; min-height: 100%; margin: 0; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--ink);
  background:
    radial-gradient(circle at 18% 9%, rgba(255,255,255,.95) 0 4%, transparent 20%),
    radial-gradient(circle at 78% 14%, rgba(38,201,218,.16), transparent 25%),
    linear-gradient(155deg, var(--bg-0), var(--bg-1) 48%, var(--bg-2));
  overflow: hidden;
}
button, input, textarea, select { font: inherit; }
button { color: inherit; }
button, [role="button"] { -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 3px solid rgba(7,152,170,.22);
  outline-offset: 2px;
}
button:disabled { opacity: .5; cursor: not-allowed; }
img { max-width: 100%; display: block; }
svg { display: block; }

.visually-hidden {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  overflow: hidden !important;
  clip: rect(0 0 0 0) !important;
  clip-path: inset(50%) !important;
  white-space: nowrap !important;
}

.app-root { min-height: 100vh; min-height: 100dvh; }

/* Splash */
.splash {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 70%, rgba(64,220,235,.34), transparent 18%),
    linear-gradient(180deg, #073852 0%, #076c85 48%, #06344e 100%);
  color: white;
}
.splash::before,
.splash::after {
  content: "";
  position: absolute;
  border: 1px solid rgba(255,255,255,.24);
  border-radius: 50%;
  animation: ripple 2.6s ease-out infinite;
}
.splash::before { width: 110px; height: 28px; bottom: 18%; }
.splash::after { width: 190px; height: 48px; bottom: 16.5%; animation-delay: .7s; }
.splash-light {
  position: absolute;
  inset: -20% 0 auto;
  height: 65%;
  background: repeating-linear-gradient(105deg, transparent 0 9%, rgba(255,255,255,.08) 10%, transparent 15%);
  filter: blur(5px);
  animation: drift 6s ease-in-out infinite alternate;
}
.splash-card {
  position: relative;
  z-index: 1;
  display: grid;
  justify-items: center;
  gap: 20px;
  animation: splashIn .85s cubic-bezier(.2,.8,.2,1) both;
}
.logo-orb {
  width: 132px;
  aspect-ratio: 1;
  border-radius: 31px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, rgba(255,255,255,.20), rgba(0,28,52,.28));
  border: 1px solid rgba(255,255,255,.42);
  box-shadow: inset 0 0 28px rgba(255,255,255,.14), 0 24px 70px rgba(0,0,0,.35), 0 0 40px rgba(45,225,239,.25);
  backdrop-filter: blur(15px);
}
.logo-orb svg { width: 84px; height: 84px; filter: drop-shadow(0 8px 12px rgba(0,0,0,.22)); }
.splash-name { font-size: clamp(28px, 6vw, 42px); font-weight: 750; letter-spacing: -.04em; }
.splash-llc { margin-top: -14px; font-size: 14px; letter-spacing: .18em; text-transform: uppercase; opacity: .78; }
.splash-loader { width: 150px; height: 4px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.18); }
.splash-loader::after { content: ""; display: block; width: 42%; height: 100%; border-radius: inherit; background: white; animation: loading 1.4s ease-in-out infinite; }

/* Authentication */
.auth-shell {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 28px 16px;
  overflow: auto;
}
.auth-shell::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 22% 18%, rgba(255,255,255,.95) 0 4%, transparent 25%),
    linear-gradient(120deg, transparent 30%, rgba(255,255,255,.28) 31%, transparent 47%);
}
.auth-card {
  position: relative;
  width: min(100%, 430px);
  border-radius: 34px;
  padding: 34px;
  background: var(--surface);
  border: 1px solid rgba(255,255,255,.72);
  box-shadow: var(--shadow);
  backdrop-filter: blur(24px);
  animation: cardIn .55s cubic-bezier(.2,.85,.2,1) both;
}
.auth-brand { display: grid; justify-items: center; text-align: center; margin-bottom: 28px; }
.brand-mark {
  width: 82px;
  height: 82px;
  border-radius: 24px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #08a8b8, #055a79);
  box-shadow: 0 18px 35px rgba(5,109,132,.28), inset 0 1px 0 rgba(255,255,255,.35);
}
.brand-mark svg { width: 56px; height: 56px; color: white; }
.auth-brand h1 { margin: 14px 0 4px; font-size: 34px; letter-spacing: -.045em; }
.auth-brand p { margin: 0; color: var(--ink-soft); font-size: 14px; }
.auth-form { display: grid; gap: 14px; }
.field { display: grid; gap: 7px; }
.field label { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
.input-wrap { position: relative; }
.input-wrap .field-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: #5f8494; }
.input-wrap input,
.input-wrap select,
.field textarea,
.field input,
.field select {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255,255,255,.82);
  color: var(--ink);
  padding: 14px 14px;
  min-height: 50px;
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.input-wrap input { padding-left: 44px; }
.field textarea { min-height: 100px; resize: vertical; }
.input-wrap input:focus, .field input:focus, .field textarea:focus, .field select:focus {
  border-color: rgba(7,152,170,.58);
  box-shadow: 0 0 0 4px rgba(7,152,170,.09);
  background: white;
  outline: none;
}
.primary-btn,
.secondary-btn,
.ghost-btn,
.danger-btn {
  border: 0;
  border-radius: 14px;
  min-height: 48px;
  padding: 0 18px;
  font-weight: 760;
  cursor: pointer;
  transition: transform .16s, box-shadow .16s, background .16s;
}
.primary-btn {
  color: white;
  background: linear-gradient(180deg, #0ba9b9, #067f96);
  box-shadow: 0 12px 24px rgba(5,123,146,.23), inset 0 1px 0 rgba(255,255,255,.22);
}
.primary-btn:hover { transform: translateY(-1px); box-shadow: 0 16px 28px rgba(5,123,146,.28); }
.secondary-btn { background: rgba(7,152,170,.09); color: var(--brand-strong); border: 1px solid rgba(7,152,170,.13); }
.ghost-btn { background: transparent; color: var(--brand-strong); }
.danger-btn { background: rgba(195,68,89,.11); color: var(--danger); }
.text-btn { border: 0; background: transparent; color: var(--brand-strong); padding: 8px; cursor: pointer; font-weight: 700; }
.auth-divider { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; color: var(--ink-soft); font-size: 12px; }
.auth-divider::before, .auth-divider::after { content: ""; height: 1px; background: var(--line); }
.security-note { display: flex; gap: 10px; align-items: flex-start; margin-top: 18px; color: var(--ink-soft); font-size: 12px; line-height: 1.45; }
.security-note svg { width: 20px; min-width: 20px; color: var(--brand); }

/* Main application */
.messenger-shell {
  height: 100vh;
  height: 100dvh;
  padding: 16px;
}
.messenger-frame {
  width: min(1380px, 100%);
  height: 100%;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 360px minmax(0,1fr);
  overflow: hidden;
  border-radius: 30px;
  background: rgba(255,255,255,.72);
  border: 1px solid rgba(255,255,255,.72);
  box-shadow: var(--shadow);
  backdrop-filter: blur(28px);
}
.sidebar {
  min-width: 0;
  display: grid;
  grid-template-rows: auto auto minmax(0,1fr) auto;
  border-right: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,255,255,.88), rgba(245,254,255,.72));
}
.sidebar-head {
  padding: 22px 18px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.mini-logo {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  color: white;
  background: linear-gradient(145deg, #0fb4c1, #075f7f);
  box-shadow: 0 10px 24px rgba(5,96,127,.2);
}
.mini-logo svg { width: 31px; height: 31px; }
.brand-copy { min-width: 0; }
.brand-copy strong { display: block; font-size: 19px; letter-spacing: -.03em; }
.brand-copy span { display: block; color: var(--ink-soft); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head-actions { margin-left: auto; display: flex; gap: 6px; }
.icon-btn {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 13px;
  display: grid;
  place-items: center;
  background: transparent;
  color: var(--ink-soft);
  cursor: pointer;
  transition: background .16s, color .16s, transform .16s;
}
.icon-btn:hover { background: var(--brand-faint); color: var(--brand-strong); transform: translateY(-1px); }
.icon-btn svg { width: 21px; height: 21px; }
.search-box { padding: 0 18px 14px; }
.search-box .input-wrap input { min-height: 44px; padding-top: 10px; padding-bottom: 10px; background: rgba(220,244,248,.55); }
.entity-list { overflow: auto; padding: 2px 10px 90px; scrollbar-width: thin; scrollbar-color: rgba(7,152,170,.2) transparent; }
.entity-card {
  width: 100%;
  border: 0;
  border-radius: 17px;
  padding: 11px 10px;
  display: grid;
  grid-template-columns: 52px minmax(0,1fr) auto;
  gap: 11px;
  align-items: center;
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition: background .17s, transform .17s;
}
.entity-card:hover { background: rgba(7,152,170,.07); transform: translateX(2px); }
.entity-card.active { background: linear-gradient(135deg, rgba(7,152,170,.16), rgba(54,198,212,.08)); }
.avatar {
  width: 52px;
  height: 52px;
  border-radius: 18px;
  overflow: hidden;
  display: grid;
  place-items: center;
  color: white;
  background: linear-gradient(145deg, #1bc0c8, #075e80);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.32);
  font-weight: 820;
  letter-spacing: -.03em;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar svg { width: 27px; height: 27px; }
.entity-main { min-width: 0; }
.entity-name-row { display: flex; gap: 6px; align-items: center; }
.entity-name { font-weight: 760; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.type-pill { padding: 2px 6px; border-radius: 99px; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--brand-strong); background: rgba(7,152,170,.10); }
.entity-preview { color: var(--ink-soft); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; margin-top: 4px; }
.entity-meta { align-self: stretch; display: grid; justify-items: end; align-content: space-between; font-size: 10px; color: var(--ink-soft); }
.unread { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; display: grid; place-items: center; color: white; background: var(--brand); font-weight: 800; }
.empty-state {
  height: 100%;
  min-height: 310px;
  display: grid;
  place-items: center;
  padding: 38px 24px;
  text-align: center;
}
.empty-illustration {
  position: relative;
  width: 180px;
  height: 150px;
  margin: 0 auto 22px;
  border-radius: 50%;
  background: radial-gradient(ellipse at center bottom, rgba(7,152,170,.18), transparent 58%);
}
.empty-illustration::after { content: ""; position: absolute; left: 20px; right: 20px; bottom: 20px; height: 1px; background: rgba(7,152,170,.2); box-shadow: 0 9px 0 rgba(7,152,170,.11), 0 18px 0 rgba(7,152,170,.06); }
.empty-illustration svg { position: absolute; width: 100px; height: 100px; left: 42px; top: 23px; color: rgba(5,95,127,.66); }
.empty-state h3 { margin: 0 0 8px; font-size: 18px; }
.empty-state p { margin: 0; color: var(--ink-soft); line-height: 1.55; font-size: 14px; }
.sidebar-nav {
  position: relative;
  z-index: 3;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding: 10px 12px calc(10px + var(--safe-bottom));
  border-top: 1px solid var(--line);
  background: rgba(255,255,255,.9);
  backdrop-filter: blur(20px);
}
.nav-btn { border: 0; background: transparent; border-radius: 14px; min-height: 56px; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--ink-soft); cursor: pointer; font-size: 10px; font-weight: 720; }
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn.active { color: var(--brand-strong); background: rgba(7,152,170,.09); }
.fab {
  position: absolute;
  right: 20px;
  bottom: calc(78px + var(--safe-bottom));
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: 4px solid rgba(255,255,255,.9);
  display: grid;
  place-items: center;
  color: white;
  background: linear-gradient(145deg, #19bdc8, #057b93);
  box-shadow: 0 16px 30px rgba(5,123,147,.34);
  cursor: pointer;
  transition: transform .16s;
}
.fab:hover { transform: translateY(-2px) rotate(-3deg); }
.fab svg { width: 24px; height: 24px; }

.content-pane { min-width: 0; position: relative; overflow: hidden; background: linear-gradient(160deg, rgba(255,255,255,.54), rgba(222,247,250,.74)); }
.welcome-pane { height: 100%; display: grid; place-items: center; padding: 36px; text-align: center; }
.welcome-card { max-width: 500px; }
.welcome-logo { width: 112px; height: 112px; border-radius: 34px; display: grid; place-items: center; margin: 0 auto 20px; color: white; background: linear-gradient(145deg,#1ac1cc,#075b7c); box-shadow: 0 20px 55px rgba(5,94,124,.28); }
.welcome-logo svg { width: 72px; height: 72px; }
.welcome-card h2 { margin: 0 0 8px; font-size: 30px; letter-spacing: -.04em; }
.welcome-card p { margin: 0; color: var(--ink-soft); line-height: 1.6; }

/* Chat pane */
.chat-pane { height: 100%; display: grid; grid-template-rows: auto minmax(0,1fr) auto; }
.chat-head {
  min-height: 76px;
  padding: 12px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--line);
  background: rgba(255,255,255,.82);
  backdrop-filter: blur(18px);
  position: relative;
  z-index: 5;
}
.mobile-back { display: none; }
.chat-title { min-width: 0; }
.chat-title strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-title span { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
.chat-head-actions { margin-left: auto; display: flex; }
.messages {
  overflow: auto;
  padding: 24px clamp(16px, 4vw, 54px);
  display: flex;
  flex-direction: column;
  gap: 12px;
  background:
    radial-gradient(circle at 15% 25%, rgba(255,255,255,.6), transparent 24%),
    linear-gradient(145deg, rgba(224,249,251,.72), rgba(255,255,255,.42));
  scroll-behavior: smooth;
}
.day-label { align-self: center; padding: 6px 11px; border-radius: 99px; background: rgba(8,79,100,.1); color: var(--ink-soft); font-size: 10px; font-weight: 760; }
.message-row { display: flex; gap: 8px; max-width: min(78%, 620px); animation: messageIn .28s ease both; }
.message-row.mine { align-self: flex-end; flex-direction: row-reverse; }
.message-row.theirs { align-self: flex-start; }
.message-bubble { position: relative; border-radius: 18px; padding: 11px 13px 8px; box-shadow: 0 5px 16px rgba(8,73,93,.07); overflow: hidden; }
.message-row.theirs .message-bubble { background: rgba(255,255,255,.94); border-bottom-left-radius: 5px; }
.message-row.mine .message-bubble { color: white; background: linear-gradient(145deg, #0a9fae, #06778e); border-bottom-right-radius: 5px; }
.message-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; font-size: 14px; }
.message-image { width: min(360px, 60vw); border-radius: 13px; margin-bottom: 8px; object-fit: cover; max-height: 380px; }
.message-meta { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 5px; font-size: 9px; opacity: .68; }
.message-meta svg { width: 13px; height: 13px; }
.system-message { align-self: center; max-width: 80%; padding: 8px 12px; border-radius: 12px; background: rgba(5,95,127,.08); color: var(--ink-soft); text-align: center; font-size: 11px; }
.typing { align-self: flex-start; display: flex; align-items: center; gap: 9px; color: var(--ink-soft); font-size: 12px; }
.typing-dots { display: flex; gap: 4px; padding: 10px 12px; border-radius: 15px 15px 15px 4px; background: white; }
.typing-dots i { width: 6px; height: 6px; border-radius: 50%; background: #7aa0ad; animation: typing 1.1s infinite; }
.typing-dots i:nth-child(2) { animation-delay: .15s; }
.typing-dots i:nth-child(3) { animation-delay: .3s; }
.composer {
  padding: 12px 16px calc(12px + var(--safe-bottom));
  border-top: 1px solid var(--line);
  background: rgba(255,255,255,.9);
  backdrop-filter: blur(18px);
}
.composer-row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 8px; align-items: end; }
.composer textarea { width: 100%; min-height: 46px; max-height: 130px; resize: none; border: 1px solid var(--line); border-radius: 17px; padding: 13px 14px; color: var(--ink); background: rgba(239,250,252,.9); outline: none; }
.send-btn { color: white; background: linear-gradient(145deg, #15b6c1, #05798f); }
.composer-note { margin-top: 6px; padding-left: 52px; color: var(--ink-soft); font-size: 10px; }
.blocked-composer { text-align: center; color: var(--danger); padding: 12px; font-size: 13px; }

/* Panels */
.section-pane { height: 100%; overflow: auto; padding: 28px clamp(18px, 4vw, 48px); }
.section-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 24px; }
.section-head h2 { margin: 0; font-size: 28px; letter-spacing: -.04em; }
.section-head p { margin: 5px 0 0; color: var(--ink-soft); }
.section-head .primary-btn { margin-left: auto; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(245px,1fr)); gap: 16px; }
.panel-card { border: 1px solid rgba(7,152,170,.12); border-radius: 22px; background: rgba(255,255,255,.82); box-shadow: var(--shadow-soft); padding: 18px; }
.panel-card h3 { margin: 0 0 6px; font-size: 17px; }
.panel-card p { margin: 0; color: var(--ink-soft); line-height: 1.5; font-size: 13px; }
.channel-card { display: grid; gap: 14px; }
.channel-card-top { display: flex; gap: 12px; align-items: center; }
.channel-card .avatar { width: 58px; height: 58px; }
.channel-stats { display: flex; flex-wrap: wrap; gap: 8px; color: var(--ink-soft); font-size: 11px; }
.stat-chip { padding: 6px 9px; border-radius: 99px; background: rgba(7,152,170,.08); }
.channel-post { padding: 13px; border-radius: 15px; background: linear-gradient(145deg, rgba(7,152,170,.08), rgba(53,197,211,.04)); line-height: 1.5; font-size: 13px; }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.small-btn { min-height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.75); color: var(--brand-strong); font-weight: 720; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.small-btn svg { width: 17px; height: 17px; }
.small-btn.active { background: var(--brand-faint); border-color: rgba(7,152,170,.26); }
.profile-grid { display: grid; grid-template-columns: minmax(0,1.2fr) minmax(270px,.8fr); gap: 18px; }
.profile-stack { display: grid; gap: 16px; align-content: start; }
.profile-hero { display: flex; gap: 16px; align-items: center; }
.profile-hero .avatar { width: 76px; height: 76px; border-radius: 24px; font-size: 24px; }
.profile-hero h2 { margin: 0; font-size: 25px; }
.profile-hero p { margin: 4px 0 0; color: var(--ink-soft); }
.premium-badge { display: inline-flex; margin-top: 8px; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 99px; background: linear-gradient(145deg, rgba(5,122,145,.14), rgba(50,198,211,.16)); color: var(--brand-strong); font-size: 10px; font-weight: 850; text-transform: uppercase; letter-spacing: .07em; }
.premium-badge svg { width: 14px; height: 14px; }
.settings-list { display: grid; gap: 8px; }
.setting-row { min-height: 58px; padding: 10px 12px; border-radius: 15px; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 11px; align-items: center; background: rgba(239,250,252,.64); }
.setting-icon { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: white; color: var(--brand-strong); box-shadow: 0 5px 12px rgba(5,92,117,.07); }
.setting-icon svg { width: 19px; height: 19px; }
.setting-copy strong { display: block; font-size: 13px; }
.setting-copy span { display: block; margin-top: 3px; color: var(--ink-soft); font-size: 11px; }
.setting-row select { border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px; color: var(--ink); background: white; max-width: 130px; }
.switch { position: relative; width: 44px; height: 26px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch-track { position: absolute; inset: 0; border-radius: 99px; background: #bdd0d7; transition: .2s; cursor: pointer; }
.switch-track::after { content: ""; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; border-radius: 50%; background: white; box-shadow: 0 3px 8px rgba(0,0,0,.18); transition: .2s; }
.switch input:checked + .switch-track { background: var(--brand); }
.switch input:checked + .switch-track::after { transform: translateX(18px); }
.price-card { position: relative; overflow: hidden; }
.price-card::before { content: ""; position: absolute; width: 140px; height: 140px; border-radius: 50%; right: -65px; top: -70px; background: rgba(49,199,212,.14); }
.price-title { display: flex; align-items: center; gap: 10px; }
.price-title .setting-icon { color: white; background: linear-gradient(145deg, #22c6cf, #076a86); }
.price-card .primary-btn { width: 100%; margin-top: 14px; }
.stars-balance { margin-top: 12px; display: flex; justify-content: space-between; align-items: center; padding: 11px 12px; border-radius: 13px; background: rgba(7,152,170,.08); }
.stars-balance strong { font-size: 20px; }
.bot-list { display: grid; gap: 10px; margin-top: 12px; }
.bot-row { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 13px; background: rgba(239,250,252,.7); }
.bot-row .avatar { width: 40px; height: 40px; border-radius: 13px; }
.bot-row-copy { min-width: 0; }
.bot-row-copy strong { display: block; font-size: 13px; }
.bot-row-copy span { display: block; color: var(--ink-soft); font-size: 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* Modals */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: 18px;
  background: rgba(3,31,44,.44);
  backdrop-filter: blur(12px);
  animation: fadeIn .18s ease both;
}
.modal {
  width: min(100%, 520px);
  max-height: min(88vh, 850px);
  overflow: auto;
  border-radius: 26px;
  background: rgba(255,255,255,.97);
  box-shadow: 0 36px 90px rgba(2,33,46,.34);
  border: 1px solid rgba(255,255,255,.78);
  animation: modalIn .28s cubic-bezier(.2,.9,.2,1) both;
}
.modal.wide { width: min(100%, 760px); }
.modal-head { position: sticky; top: 0; z-index: 2; min-height: 68px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.92); backdrop-filter: blur(14px); }
.modal-title { min-width: 0; }
.modal-title strong { display: block; font-size: 18px; }
.modal-title span { display: block; color: var(--ink-soft); font-size: 11px; margin-top: 2px; }
.modal-head .icon-btn { margin-left: auto; }
.modal-body { padding: 20px; }
.modal-actions { position: sticky; bottom: 0; padding: 14px 20px 20px; display: flex; justify-content: flex-end; gap: 10px; background: linear-gradient(transparent, rgba(255,255,255,.98) 26%); }
.choice-grid { display: grid; gap: 10px; }
.choice-card { width: 100%; border: 1px solid var(--line); border-radius: 17px; background: rgba(244,252,253,.8); padding: 14px; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 12px; align-items: center; text-align: left; cursor: pointer; }
.choice-card:hover { border-color: rgba(7,152,170,.32); background: rgba(7,152,170,.07); }
.choice-icon { width: 45px; height: 45px; border-radius: 14px; display: grid; place-items: center; color: white; background: linear-gradient(145deg, #15b9c4, #077089); }
.choice-icon svg { width: 23px; height: 23px; }
.choice-copy strong { display: block; font-size: 14px; }
.choice-copy span { display: block; margin-top: 4px; color: var(--ink-soft); font-size: 11px; line-height: 1.4; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.upload-preview { min-height: 120px; border: 1px dashed rgba(7,152,170,.35); border-radius: 18px; display: grid; place-items: center; color: var(--ink-soft); background: rgba(7,152,170,.035); cursor: pointer; overflow: hidden; }
.upload-preview img { width: 100%; height: 180px; object-fit: cover; }
.upload-preview svg { width: 32px; height: 32px; color: var(--brand); margin: 0 auto 8px; }
.upload-preview span { font-size: 12px; }
.invite-layout { display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 20px; align-items: center; }
.qr-wrap { padding: 16px; border-radius: 20px; background: white; box-shadow: 0 12px 30px rgba(5,81,104,.13); }
.qr-wrap canvas { width: 100%; height: auto; image-rendering: pixelated; }
.code-box { padding: 12px; border-radius: 12px; background: rgba(7,152,170,.08); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }
.check-list { display: grid; gap: 8px; margin-top: 10px; }
.check-row { display: flex; align-items: center; gap: 9px; padding: 10px; border-radius: 12px; background: rgba(239,250,252,.65); }
.payment-card { border-radius: 20px; padding: 22px; color: white; background: linear-gradient(135deg, #064b69, #0aa7b3); box-shadow: 0 20px 44px rgba(5,86,111,.25); }
.payment-card-top { display: flex; justify-content: space-between; align-items: center; }
.payment-card-brand { font-weight: 800; letter-spacing: .08em; }
.payment-chip { width: 38px; height: 28px; border-radius: 7px; background: linear-gradient(135deg,#e8d49a,#a68d42); opacity: .9; }
.payment-number { margin: 26px 0 18px; font-size: clamp(17px,4vw,24px); letter-spacing: .11em; }
.payment-meta { display: flex; justify-content: space-between; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
.info-banner { padding: 12px 13px; border-radius: 13px; display: flex; gap: 10px; background: rgba(7,152,170,.08); color: var(--ink-soft); font-size: 12px; line-height: 1.45; }
.info-banner svg { width: 20px; min-width: 20px; color: var(--brand); }
.reaction-row { display: flex; gap: 8px; flex-wrap: wrap; }
.reaction-btn { min-width: 42px; height: 38px; border: 1px solid var(--line); border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; background: white; cursor: pointer; color: var(--ink-soft); }
.reaction-btn svg { width: 17px; height: 17px; }
.reaction-btn.selected { color: var(--brand-strong); background: var(--brand-faint); border-color: rgba(7,152,170,.28); }
.comment-list { display: grid; gap: 10px; margin-bottom: 14px; max-height: 320px; overflow: auto; }
.comment { padding: 11px 12px; border-radius: 14px; background: rgba(239,250,252,.8); }
.comment strong { display: block; font-size: 12px; }
.comment p { margin: 4px 0 0; color: var(--ink-soft); font-size: 12px; line-height: 1.45; }

/* Menus and toast */
.popover { position: absolute; z-index: 30; min-width: 210px; padding: 8px; border-radius: 16px; background: rgba(255,255,255,.98); border: 1px solid var(--line); box-shadow: 0 18px 45px rgba(3,46,61,.22); animation: popIn .16s ease both; }
.popover.right { right: 14px; top: 64px; }
.menu-item { width: 100%; min-height: 42px; padding: 9px 10px; border: 0; border-radius: 11px; background: transparent; display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer; color: var(--ink); }
.menu-item:hover { background: var(--brand-faint); }
.menu-item.danger { color: var(--danger); }
.menu-item svg { width: 19px; height: 19px; }
.toast-root { position: fixed; z-index: 100; right: 16px; bottom: calc(18px + var(--safe-bottom)); display: grid; gap: 9px; pointer-events: none; }
.toast { width: min(360px, calc(100vw - 32px)); padding: 13px 14px; border-radius: 15px; display: flex; align-items: flex-start; gap: 10px; color: white; background: rgba(7,54,72,.94); box-shadow: 0 18px 40px rgba(3,42,55,.25); animation: toastIn .25s ease both; pointer-events: auto; }
.toast svg { width: 20px; min-width: 20px; color: #72e1e7; }
.toast strong { display: block; font-size: 13px; }
.toast span { display: block; margin-top: 3px; font-size: 11px; opacity: .8; line-height: 1.4; }

/* Themes */
body[data-theme="midnight"] {
  --bg-0: #061c2b;
  --bg-1: #0a3141;
  --bg-2: #074b5b;
  --surface: rgba(9,37,50,.88);
  --surface-strong: #0b2b3b;
  --surface-soft: rgba(10,43,59,.72);
  --ink: #e9fbff;
  --ink-soft: #9eb9c2;
  --line: rgba(126,220,231,.12);
  --brand-faint: rgba(36,202,214,.12);
  color-scheme: dark;
}
body[data-theme="midnight"] .sidebar,
body[data-theme="midnight"] .chat-head,
body[data-theme="midnight"] .composer,
body[data-theme="midnight"] .sidebar-nav { background: rgba(7,31,43,.9); }
body[data-theme="midnight"] .content-pane { background: linear-gradient(160deg, rgba(4,28,39,.78), rgba(5,54,65,.78)); }
body[data-theme="midnight"] .messages { background: linear-gradient(145deg, rgba(4,34,47,.92), rgba(7,55,66,.74)); }
body[data-theme="midnight"] .message-row.theirs .message-bubble,
body[data-theme="midnight"] .panel-card,
body[data-theme="midnight"] .modal,
body[data-theme="midnight"] .popover { background: rgba(10,42,56,.97); }
body[data-theme="midnight"] input,
body[data-theme="midnight"] textarea,
body[data-theme="midnight"] select,
body[data-theme="midnight"] .small-btn,
body[data-theme="midnight"] .reaction-btn { background: rgba(13,52,68,.95); color: var(--ink); }
body[data-theme="pearl"] {
  --bg-0: #fffefe;
  --bg-1: #f0f6f8;
  --bg-2: #e2ecef;
  --brand: #347e91;
  --brand-strong: #235c70;
  --accent: #89c2cc;
  --brand-faint: rgba(52,126,145,.10);
}
.chat-theme-mist .messages { background: linear-gradient(145deg,#f4fbfc,#eaf2f4); }
.chat-theme-night .messages { background: linear-gradient(145deg,#071d2b,#0a3b4b); }
.chat-theme-night .message-row.theirs .message-bubble { background: #123b4d; color: #eafcff; }
.chat-theme-night .day-label { color: #c7e5ea; background: rgba(255,255,255,.12); }

/* Responsive */
@media (max-width: 820px) {
  body { overflow: hidden; }
  .messenger-shell { padding: 0; }
  .messenger-frame { border-radius: 0; grid-template-columns: 1fr; border: 0; }
  .sidebar { border-right: 0; height: 100%; }
  .content-pane { position: fixed; inset: 0; z-index: 20; transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
  .messenger-frame.show-content .content-pane { transform: translateX(0); }
  .mobile-back { display: grid; }
  .sidebar-head { padding-top: calc(14px + var(--safe-top)); }
  .chat-head { padding-top: calc(10px + var(--safe-top)); min-height: calc(72px + var(--safe-top)); }
  .section-pane { padding-top: calc(22px + var(--safe-top)); }
  .profile-grid { grid-template-columns: 1fr; }

function icon(name, className = '') {
  const body = ICONS[name] || ICONS.info;
  const fillMode = ['logo', 'qr'].includes(name) ? 'fill="currentColor" stroke="none"' : 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
  const viewBox = name === 'logo' ? '0 0 24 24' : '0 0 24 24';
  return `<svg class="${className}" viewBox="${viewBox}" aria-hidden="true" ${fillMode}>${body}</svg>`;
}

function tx(key, vars = {}) {
  const lang = state.language in I18N ? state.language : 'en';
  let value = I18N[lang][key] ?? I18N.en[key] ?? key;
  for (const [name, replacement] of Object.entries(vars)) value = value.replace(`{${name}}`, String(replacement));
  return value;
}

function escapeHtml(value = '') {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function makeId(prefix = 'id') {
  return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
}

function nowIso() { return new Date().toISOString(); }

function loadState() {

    if (!parsed || parsed.version !== APP_VERSION) return defaultState();
    return { ...defaultState(), ...parsed, settings: { ...defaultState().settings, ...(parsed.settings || {}) } };
  } catch {

  }
}

async function hashPassword(password) {
  if (window.crypto?.subtle) {
    const bytes = new TextEncoder().encode(password);
    const digest = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(digest)).map(v => v.toString(16).padStart(2, '0')).join('');
  }
  let hash = 0;
  for (let i = 0; i < password.length; i += 1) hash = ((hash << 5) - hash + password.charCodeAt(i)) | 0;
  return String(hash);
}

function formatTime(iso) {
  try {
    return new Intl.DateTimeFormat(state.language === 'ru' ? 'ru-RU' : 'en-US', { hour: '2-digit', minute: '2-digit' }).format(new Date(iso));
  } catch { return ''; }
}

function formatDateTime(iso) {

}

function initials(name = 'AquaKotik') {

globalFileInput.addEventListener('change', async () => {
  const file = globalFileInput.files?.[0];
  if (!file || !filePickerCallback) return;
  if (file.size > 8_000_000) {
    showToast(state.language === 'ru' ? 'Файл слишком большой' : 'File is too large', state.language === 'ru' ? 'Выберите изображение размером до 8 МБ.' : 'Choose an image smaller than 8 MB.', 'info');
    return;
  }
  try {
    const dataUrl = await compressImageFile(file);
    filePickerCallback(dataUrl);
  } catch {
    showToast(state.language === 'ru' ? 'Не удалось прочитать изображение' : 'Could not read the image', '', 'info');
  }
});

function compressImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const image = new Image();
      image.onerror = reject;
      image.onload = () => {
        const maxSide = 1280;
        const ratio = Math.min(1, maxSide / Math.max(image.width, image.height));
        const width = Math.max(1, Math.round(image.width * ratio));
        const height = Math.max(1, Math.round(image.height * ratio));
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const context = canvas.getContext('2d');
        context.drawImage(image, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      image.src = String(reader.result);
    };
    reader.readAsDataURL(file);
  });
}

    actions: `<button class="secondary-btn" type="button" data-close-modal>${escapeHtml(tx('cancel'))}</button><button class="primary-btn" type="submit" form="registration-form">${escapeHtml(tx('createAccount'))}</button>`,

        const seed = `${email}-${Date.now()}-${Math.random()}`;
        const aquaCode = `AK${Math.abs(simpleHash(seed)).toString(36).toUpperCase().padStart(6, '0').slice(0, 6)}`;

        } catch { /* server offline — local registration continues */ }
        state.account = { id: makeId('user'), name, email, passwordHash: await hashPassword(password), createdAt: nowIso(), avatar: null, aquaCode };
        state.language = root.querySelector('#reg-language').value;
        state.stars = 0;
        sessionAuthenticated = true;
        seedPublicChannels();
        saveState();
        closeModal();
        showToast(tx('accountCreated'), name, 'check');
        renderMain();
      });
    }
  });
  show();
}

function getEntity(id) { return state.entities.find(entity => entity.id === id); }
function getMessages(id) { return state.messages[id] || []; }

function getLastMessage(entity) {
  const list = getMessages(entity.id);
  const last = list[list.length - 1];
  if (last) return last.text || (last.image ? tx('photo') : '');
  if (entity.type === 'channel') return entity.posts?.[entity.posts.length - 1]?.text || entity.description;
  return entity.description || '';
}

function filteredEntities() {
  const query = ui.search.trim().toLowerCase();
  let list;
  if (ui.tab === 'channels') list = state.entities.filter(e => e.type === 'channel');
  else if (ui.tab === 'profile') list = [];
  else list = state.entities.filter(e => e.type !== 'channel');
  if (query) list = list.filter(e => `${e.title} ${e.description || ''} ${e.phone || ''}`.toLowerCase().includes(query));
  return list.sort((a, b) => {
    const aTime = getMessages(a.id).at(-1)?.createdAt || a.createdAt;
    const bTime = getMessages(b.id).at(-1)?.createdAt || b.createdAt;
    return new Date(bTime) - new Date(aTime);
  });
}

function renderSidebarList() {
  if (ui.tab === 'profile') {
    return `<div class="empty-state"><div><div class="empty-illustration">${icon('settings')}</div><h3>${escapeHtml(tx('profileSettings'))}</h3><p>${escapeHtml(tx('profileHint'))}</p></div></div>`;
  }
  const list = filteredEntities();
  if (!list.length) {
    return `<div class="empty-state"><div><div class="empty-illustration">${icon(ui.tab === 'channels' ? 'channel' : 'logo')}</div><h3>${escapeHtml(ui.tab === 'channels' ? tx('noChannels') : tx('emptyChatsTitle'))}</h3><p>${escapeHtml(ui.tab === 'channels' ? tx('noChannelsHint') : tx('emptyChats'))}</p></div></div>`;
  }
  return list.map(entity => {
    const lastMessages = getMessages(entity.id);
    const last = lastMessages.at(-1);
    const unread = entity.unread || 0;
    return `<button class="entity-card ${ui.selectedId === entity.id ? 'active' : ''}" type="button" data-open-entity="${entity.id}">
      ${avatarMarkup(entity)}
      <span class="entity-main">
        <span class="entity-name-row"><span class="entity-name">${escapeHtml(entity.title)}</span><span class="type-pill">${escapeHtml(typeLabel(entity.type))}</span></span>
        <span class="entity-preview">${escapeHtml(getLastMessage(entity) || tx('created'))}</span>
      </span>
      <span class="entity-meta"><span>${last ? formatTime(last.createdAt) : ''}</span>${unread ? `<span class="unread">${unread}</span>` : ''}</span>
    </button>`;
  }).join('');
}

    ? `${entity.members?.length || 1} ${tx('members')}`

function channelSubscribers(channel) {
  const elapsedDays = Math.max(0, Math.floor((Date.now() - new Date(channel.createdAt).getTime()) / 86400000));
  return (channel.baseSubscribers || 1) + elapsedDays * (channel.growthPerDay || 1);
}

function bindMainEvents() {
  document.querySelectorAll('[data-tab]').forEach(button => button.addEventListener('click', () => {
    ui.tab = button.dataset.tab;
    ui.selectedId = null;
    ui.chatMenu = false;
    ui.mobileContent = ui.tab !== 'chats';
    renderMain();
  }));

  document.querySelectorAll('[data-open-entity]').forEach(button => button.addEventListener('click', () => {
    const entity = getEntity(button.dataset.openEntity);
    if (!entity) return;
    if (entity.type === 'channel') {
      ui.tab = 'channels';
      ui.mobileContent = true;
      renderMain();
      return;
    }
    ui.selectedId = entity.id;
    ui.mobileContent = true;
    entity.unread = 0;
    saveState();
    renderMain();
  }));

  const search = document.getElementById('entity-search');
  search?.addEventListener('input', event => {
    ui.search = event.target.value;
    const list = document.querySelector('.entity-list');
    if (list) list.innerHTML = renderSidebarList();
    document.querySelectorAll('[data-open-entity]').forEach(button => button.addEventListener('click', () => {
      const entity = getEntity(button.dataset.openEntity);
      if (!entity) return;
      if (entity.type === 'channel') { ui.tab = 'channels'; ui.mobileContent = true; } else { ui.selectedId = entity.id; ui.mobileContent = true; entity.unread = 0; }
      saveState(); renderMain();
    }));
  });

  document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => handleAction(button.dataset.action)));
  document.querySelectorAll('[data-chat-action]').forEach(button => button.addEventListener('click', () => handleChatAction(button.dataset.chatAction)));
  document.querySelectorAll('[data-channel-action]').forEach(button => button.addEventListener('click', () => handleChannelAction(button.dataset.channelAction, button.dataset.id, button.dataset.reaction)));
  document.querySelectorAll('[data-bot-action]').forEach(button => button.addEventListener('click', () => runBotAction(button.dataset.botAction)));

  const messageInput = document.getElementById('message-input');
  messageInput?.addEventListener('input', () => {
    messageInput.style.height = 'auto';
    messageInput.style.height = `${Math.min(messageInput.scrollHeight, 130)}px`;
  });
  messageInput?.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendCurrentMessage();
    }
  });

  document.getElementById('app-theme')?.addEventListener('change', event => {
    state.settings.theme = event.target.value;
    saveState();
    renderMain();
  });
  document.getElementById('app-language')?.addEventListener('change', event => {
    state.language = event.target.value;
    saveState();
    renderMain();
  });
  document.getElementById('notifications-toggle')?.addEventListener('change', handleNotificationToggle);
}

function handleAction(action) {
  if (action === 'add') openAddMenu();
  if (action === 'create-channel') openCreateEntity('channel');
  if (action === 'mobile-back') {
    ui.mobileContent = false;
    ui.selectedId = null;
    ui.chatMenu = false;
    if (ui.tab !== 'chats') ui.tab = 'chats';
    renderMain();
  }
  if (action === 'chat-menu') { ui.chatMenu = !ui.chatMenu; renderMain(); }
  if (action === 'attach') {
    pickImage(dataUrl => {
      const entity = getEntity(ui.selectedId);
      if (!entity) return;
      addMessage(entity.id, { sender: 'me', image: dataUrl, text: '', createdAt: nowIso() });
      scheduleReply(entity, state.language === 'ru' ? 'Пользователь отправил изображение.' : 'The user sent an image.');
      renderMain();
    });
  }
  if (action === 'send') sendCurrentMessage();
  if (action === 'buy-premium') openPremiumPayment();
  if (action === 'buy-stars') openStarsPayment();
  if (action === 'create-bot') openCreateBot();
  if (action === 'status') openStatus();
  if (action === 'install') installApp();
  if (action === 'logout') confirmLogout();
}

function openAddMenu() {
  showModal({
    title: tx('addNew'),
    body: `<div class="choice-grid">
      ${choiceCard('chat','chats',tx('newChat'),tx('newChatHint'))}
      ${choiceCard('group','users',tx('createGroup'),tx('createGroupHint'))}
      ${choiceCard('channel','channel',tx('createChannel'),tx('createChannelHint'))}
    </div>`,
    onReady(root) {
      root.querySelectorAll('[data-create-type]').forEach(button => button.addEventListener('click', () => {
        const type = button.dataset.createType;
        closeModal();
        openCreateEntity(type);
      }));
    }
  });
}

  let selectedAvatar = null;
  const contacts = state.entities.filter(e => e.type === 'chat' || e.type === 'bot');
  const title = type === 'chat' ? tx('newChat') : type === 'group' ? tx('createGroup') : tx('createChannel');
  const nameLabel = type === 'chat' ? tx('name') : type === 'group' ? tx('groupName') : tx('channelName');
  const membersMarkup = type !== 'chat' ? `<div class="field full"><label>${escapeHtml(tx('participants'))}</label>${contacts.length ? `<div class="check-list">${contacts.map(c => `<label class="check-row"><input type="checkbox" name="members" value="${c.id}">${avatarMarkup(c)}<span>${escapeHtml(c.title)}</span></label>`).join('')}</div>` : `<div class="info-banner">${icon('info')}<span>${escapeHtml(tx('noContacts'))}</span></div>`}</div>` : '';
  showModal({
    title,
    subtitle: type === 'chat' ? tx('newChatHint') : type === 'group' ? tx('createGroupHint') : tx('createChannelHint'),
    body: `<form id="entity-form" class="form-grid">
      <div class="field ${type === 'chat' ? '' : 'full'}"><label for="entity-title">${escapeHtml(nameLabel)}</label><input id="entity-title" required maxlength="48"></div>

function addMessage(entityId, message) {
  if (!state.messages[entityId]) state.messages[entityId] = [];
  state.messages[entityId].push({ id: makeId('message'), createdAt: nowIso(), ...message });
  saveState();
}

function sendCurrentMessage() {
  const entity = getEntity(ui.selectedId);
  const input = document.getElementById('message-input');
  if (!entity || !input || entity.blocked) return;
  const text = input.value.trim();
  if (!text) return;
  addMessage(entity.id, { sender: 'me', text });
  input.value = '';
  scheduleReply(entity, text);
  showToast(tx('sent'), tx('automatedReplyPending'), 'check', 2200);
  renderMain();
}

function scheduleReply(entity, prompt) {
  const dueAt = Date.now() + 4000 + Math.floor(Math.random() * 296000);
  state.scheduled.push({ id: makeId('scheduled'), kind: 'reply', entityId: entity.id, dueAt, prompt, createdAt: Date.now() });
  saveState();
  scheduleNextTick();
}

function scheduleProactive(entity) {
  if (entity.type === 'channel') return;
  state.scheduled.push({ id: makeId('scheduled'), kind: 'proactive', entityId: entity.id, dueAt: Date.now() + 45000 + Math.floor(Math.random() * 135000), createdAt: Date.now() });
  saveState();
  scheduleNextTick();
}

function scheduleNextTick() {
  if (scheduledTimer) clearTimeout(scheduledTimer);
  const next = state.scheduled.reduce((min, item) => Math.min(min, item.dueAt), Infinity);
  if (!Number.isFinite(next)) return;
  scheduledTimer = setTimeout(processScheduled, Math.max(500, Math.min(next - Date.now(), 5000)));
}

function processScheduled() {
  const now = Date.now();
  const due = state.scheduled.filter(item => item.dueAt <= now);
  state.scheduled = state.scheduled.filter(item => item.dueAt > now);
  for (const task of due) {
    const entity = getEntity(task.entityId);
    if (!entity || entity.blocked) continue;
    const text = task.kind === 'proactive' ? proactiveMessage(entity) : makeLocalAiReply(task.prompt, entity);
    addMessage(entity.id, { sender: 'them', text });
    if (ui.selectedId !== entity.id || document.hidden) entity.unread = (entity.unread || 0) + 1;
    notifyUser(entity.title, text);
  }
  saveState();
  if (due.length && sessionAuthenticated) renderMain();
  scheduleNextTick();
}

function makeLocalAiReply(input, entity) {
  if (entity.type === 'bot') {
    const bot = state.bots.find(item => item.entityId === entity.id);
    if (bot) {
      const lower = input.toLowerCase();
      const matched = bot.buttons?.find(button => lower.includes(button.toLowerCase()));
      if (matched) return state.language === 'ru' ? `Бот выполнил команду «${matched}». Результат сохранен локально.` : `The bot completed the “${matched}” command. The result was saved locally.`;
      return bot.description || (state.language === 'ru' ? 'Я локальный бот AquaKotik. Выберите одну из настроенных команд.' : 'I am a local AquaKotik bot. Choose one of the configured commands.');
    }
  }
  const text = input.toLowerCase();
  const ru = state.language === 'ru';
  const rules = [
    { keys: ['привет','здравств','hello','hi','hey'], ru: 'Здравствуйте. Я на связи. О чем вы хотите поговорить?', en: 'Hello. I am here. What would you like to discuss?' },
    { keys: ['как дела','how are you'], ru: 'Все системы работают нормально. Я готов помочь с идеями, текстом или планированием.', en: 'All local systems are running normally. I can help with ideas, writing or planning.' },
    { keys: ['возможност','can you','what can','умеешь'], ru: 'Я умею поддерживать беседу, предлагать варианты, структурировать задачи и отвечать на частые вопросы. В этой версии ответы создаются без внешнего сервера.', en: 'I can maintain a conversation, suggest options, structure tasks and answer common questions. This version generates replies without an external server.' },
    { keys: ['время','time'], ru: `Сейчас ${new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit'}).format(new Date())}.`, en: `The current time is ${new Intl.DateTimeFormat('en-US',{hour:'2-digit',minute:'2-digit'}).format(new Date())}.` },
    { keys: ['спасибо','thank'], ru: 'Пожалуйста. Сообщение сохранено в истории этого чата.', en: 'You are welcome. The message has been saved in this conversation history.' },
    { keys: ['помоги','help'], ru: 'Опишите задачу одним или двумя предложениями. Я предложу последовательный план действий.', en: 'Describe the task in one or two sentences. I will suggest a clear sequence of actions.' },
    { keys: ['premium','премиум'], ru: 'Aqua Premium открывает статусы и дополнительные визуальные возможности профиля. Покупка в этом прототипе является демонстрационной.', en: 'Aqua Premium unlocks statuses and additional profile visuals. Purchases in this prototype are simulated.' },
    { keys: ['stars','звезд','старс'], ru: 'Aqua Stars используются для сообщений администраторам каналов, подарков и действий ботов.', en: 'Aqua Stars are used for channel administrator messages, gifts and bot actions.' },
    { keys: ['канал','channel'], ru: 'В каналах можно читать публикации, ставить реакции, писать комментарии и связывать собственный канал с группой.', en: 'Channels support posts, reactions, comments and linking your own channel to a group.' },
    { keys: ['группа','group'], ru: 'Для группы создается код приглашения. Участников также можно выбрать из существующих чатов.', en: 'A group receives an invitation code. Participants can also be selected from existing chats.' }
  ];
  const rule = rules.find(item => item.keys.some(key => text.includes(key)));
  if (rule) return ru ? rule.ru : rule.en;
  const genericRu = [
    'Понял сообщение. Могу помочь уточнить цель и разделить задачу на небольшие шаги.',
    'Интересная мысль. Лучше начать с главного результата, а затем определить ограничения и следующий шаг.',
    'Я сохранил контекст этой беседы локально. Расскажите немного подробнее, и я предложу более точный ответ.',
    'Можно рассмотреть несколько вариантов. Практичный подход: сначала сделать простую версию, проверить ее, затем добавлять детали.'
  ];
  const genericEn = [
    'I understand. I can help clarify the goal and divide the task into smaller steps.',
    'That is an interesting point. Start with the desired result, then define constraints and the next action.',
    'I kept the context of this conversation locally. Add a little more detail and I will give a more precise reply.',
    'There are several possible approaches. A practical route is to build a simple version, test it, and then add detail.'
  ];
  const pool = ru ? genericRu : genericEn;
  return pool[Math.abs(simpleHash(input)) % pool.length];
}

function proactiveMessage(entity) {
  const ru = state.language === 'ru';
  const chatMessagesRu = [
    'Здравствуйте. Я появился в AquaKotik и решил первым начать разговор.',
    'У меня есть свободная минута. Как проходит ваш день?',
    'Проверяю связь. Сообщения и история чата сохраняются на этом устройстве.'
  ];
  const chatMessagesEn = [
    'Hello. I joined AquaKotik and decided to start the conversation.',
    'I have a free minute. How is your day going?',
    'Checking the connection. Messages and conversation history are saved on this device.'
  ];
  const pool = ru ? chatMessagesRu : chatMessagesEn;
  return pool[Math.abs(simpleHash(entity.id)) % pool.length];
}

function simpleHash(value) {
  let hash = 0;
  for (let i = 0; i < value.length; i += 1) hash = ((hash << 5) - hash + value.charCodeAt(i)) | 0;
  return hash;
}

function drawQrStyle(canvas, seed) {
  const ctx = canvas.getContext('2d');
  const size = 29;
  const cell = canvas.width / size;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  const hash = Math.abs(simpleHash(seed));
  const reserved = new Set();
  function finder(x, y) {
    for (let row=0; row<7; row++) for (let col=0; col<7; col++) {
      reserved.add(`${x+col},${y+row}`);
      const edge = row===0 || row===6 || col===0 || col===6;
      const center = row>=2 && row<=4 && col>=2 && col<=4;
      if (edge || center) ctx.fillRect((x+col)*cell,(y+row)*cell,Math.ceil(cell),Math.ceil(cell));
    }
  }
  ctx.fillStyle = '#075f7d'; finder(1,1); finder(size-8,1); finder(1,size-8);
  for (let y=0; y<size; y++) for (let x=0; x<size; x++) {
    if (reserved.has(`${x},${y}`)) continue;
    const n = (hash + x*31 + y*47 + x*y*13) % 11;
    if (n < 5) ctx.fillRect(x*cell,y*cell,Math.ceil(cell),Math.ceil(cell));
  }
}

    if (channel.userReaction) channel.reactions[channel.userReaction] = Math.max(0, (channel.reactions[channel.userReaction] || 1) - 1);
    if (channel.userReaction === reaction) channel.userReaction = null;
    else { channel.userReaction = reaction; channel.reactions[reaction] = (channel.reactions[reaction] || 0) + 1; }
    saveState(); renderMain();
  }
  if (action === 'comments') openComments(channel);
  if (action === 'publish') openPublish(channel);
  if (action === 'members') openManageMembers(channel);

async function handleNotificationToggle(event) {
  if (!event.target.checked) {
    state.settings.notifications = false;
    saveState();
    return;
  }
  if (!('Notification' in window)) {
    event.target.checked = false;
    showToast(tx('notificationDenied'), '', 'bell');
    return;
  }
  const permission = await Notification.requestPermission();
  state.settings.notifications = permission === 'granted';
  event.target.checked = state.settings.notifications;
  saveState();
  showToast(state.settings.notifications ? tx('notificationEnabled') : tx('notificationDenied'), '', 'bell');
}

async function notifyUser(title, body) {
  if (!state.settings.notifications || Notification.permission !== 'granted') return;
  try {
    const registration = await navigator.serviceWorker?.ready;
    if (registration) await registration.showNotification(title, { body, icon:'icons/icon-192.png', badge:'icons/icon-192.png', tag:'aquakotik-message' });
    else new Notification(title, { body });
  } catch {}
}

function defaultState() {
  return {
    version: APP_VERSION,
    language: 'en',
    account: null,
    settings: { theme: 'ocean', notifications: false },
    premium: false,
    stars: 0,
    entities: [],
    messages: {},
    bots: [],
    status: null,
    scheduled: [],
    seeded: false,
    calls: [],
    transactions: [],
    assistantHistory: []
  };
}

function loadState() {
  try {
    const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!parsed) return defaultState();
    const base = defaultState();
    const next = { ...base, ...parsed, settings: { ...base.settings, ...(parsed.settings || {}) } };
    next.calls = Array.isArray(parsed.calls) ? parsed.calls : [];
    next.transactions = Array.isArray(parsed.transactions) ? parsed.transactions : [];
    next.assistantHistory = Array.isArray(parsed.assistantHistory) ? parsed.assistantHistory : [];
    next.entities = (Array.isArray(parsed.entities) ? parsed.entities : []).filter(entity => entity.type !== 'bot');
    next.bots = [];
    if ((parsed.stars === 250 || parsed.stars == null) && !next.transactions.length) next.stars = 0;
    next.entities.forEach(entity => {
      if (entity.type === 'channel' && typeof entity.subscribed !== 'boolean') entity.subscribed = Boolean(entity.owner);
    });
    return next;
  } catch {
    return defaultState();
  }
}

function ensureAssistant() {
  if (!state.account) return;
  let assistant = state.entities.find(entity => entity.type === 'assistant');
  if (!assistant) {
    assistant = {
      id: 'aquakotik-assistant', type: 'assistant', title: state.language === 'ru' ? 'Aqua Ассистент' : 'Aqua Assistant',
      description: tx('assistantHint'), createdAt: nowIso(), blocked: false, chatTheme: 'ocean', unread: 0
    };
    state.entities.unshift(assistant);
    state.messages[assistant.id] = [{
      id: makeId('message'), sender: 'them',
      text: state.language === 'ru' ? 'Я помогу подготовить сообщение, придумать ответ или исправить текст. Напишите задачу обычными словами.' : 'I can prepare a message, suggest a reply or correct your text. Describe the task in plain language.',
      createdAt: nowIso()
    }];

  } else {
    assistant.title = state.language === 'ru' ? 'Aqua Ассистент' : 'Aqua Assistant';
    assistant.description = tx('assistantHint');
  }
}

function compressImageFile(file) {
  if (file.type.startsWith('video/')) {
    return new Promise((resolve, reject) => {
      if (file.size > 5_000_000) { reject(new Error('video-too-large')); return; }
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = () => resolve(String(reader.result));
      reader.readAsDataURL(file);
    });
  }
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const image = new Image();
      image.onerror = reject;
      image.onload = () => {
        const maxSide = 1280;
        const ratio = Math.min(1, maxSide / Math.max(image.width, image.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(image.width * ratio));
        canvas.height = Math.max(1, Math.round(image.height * ratio));
        const context = canvas.getContext('2d');
        context.drawImage(image, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', .82));
      };
      image.src = String(reader.result);
    };
    reader.readAsDataURL(file);
  });
}

function renderChatPane(entity) {
  if (!entity) { ui.selectedId = null; return renderWelcomePane(); }
  const messages = getMessages(entity.id);
  const chatThemeClass = `chat-theme-${entity.chatTheme || 'ocean'}`;
  const typing = state.scheduled.some(item => item.entityId === entity.id && item.kind === 'reply' && item.dueAt - Date.now() < 12000);
  const subtitle = entity.type === 'group'
    ? `${Math.max(1, entity.joinedMembers?.length || entity.members?.length || 1)} ${tx('members')}`
    : entity.type === 'assistant' ? tx('assistantOnline')
      : (simpleHash(entity.id) % 2 ? tx('contactRecently') : tx('contactOnline'));
  return `<div class="chat-pane ${chatThemeClass}">
    <header class="chat-head">
      <button class="icon-btn mobile-back" type="button" data-action="mobile-back">${icon('back')}</button>

      ${messages.length ? messages.map(renderMessage).join('') : ''}
      ${typing ? `<div class="typing"><div class="typing-dots"><i></i><i></i><i></i></div><span>${escapeHtml(entity.type === 'assistant' ? tx('assistantOnline') : tx('contactOnline'))}</span></div>` : ''}
    </div>
    ${entity.blocked ? `<div class="composer"><div class="blocked-composer">${escapeHtml(tx('blocked'))}</div></div>` : renderComposer(entity)}

function renderMessage(message) {
  if (message.system) return `<div class="system-message">${escapeHtml(message.text)}</div>`;
  const mine = message.sender === 'me';
  const media = message.video
    ? `<video class="message-video" src="${escapeHtml(message.video)}" controls playsinline></video>`
    : message.image ? `<img class="message-image" src="${escapeHtml(message.image)}" alt="${escapeHtml(tx('photo'))}">` : '';
  const poll = message.poll ? renderPoll(message) : '';
  return `<div class="message-row ${mine ? 'mine' : 'theirs'}" data-message-row="${message.id}">
    <div class="message-bubble">
      ${mine ? `<div class="message-tools"><button class="message-delete" type="button" data-delete-message="${message.id}" aria-label="${escapeHtml(tx('deleteMessage'))}">${icon('trash')}</button></div>` : ''}
      ${media}${poll}${message.text ? `<div class="message-text">${escapeHtml(message.text)}</div>` : ''}
      <div class="message-meta"><span>${formatTime(message.createdAt)}</span>${mine ? icon('checkDouble') : ''}</div>
    </div>
  </div>`;
}

function renderPoll(message) {
  const poll = message.poll;
  const total = poll.options.reduce((sum, option) => sum + (option.votes || 0), 0);
  return `<div class="poll-card"><div class="poll-title">${escapeHtml(poll.question)}</div><div class="poll-options">${poll.options.map((option,index) => {
    const percent = total ? Math.round((option.votes || 0) / total * 100) : 0;
    return `<button class="poll-option ${poll.voted === index ? 'selected' : ''}" type="button" data-poll-vote="${message.id}" data-option="${index}"><span class="poll-option-fill" style="width:${percent}%"></span><span class="poll-option-content"><span>${escapeHtml(option.text)}</span><strong>${percent}%</strong></span></button>`;
  }).join('')}</div><div class="poll-total">${total} ${escapeHtml(tx('votes'))}</div></div>`;
}

function bindMainEvents() {
  document.querySelectorAll('[data-tab]').forEach(button => button.addEventListener('click', () => {
    ui.tab = button.dataset.tab; ui.selectedId = null; ui.chatMenu = false; ui.mobileContent = ui.tab !== 'chats'; renderMain();
  }));
  document.querySelectorAll('[data-open-entity]').forEach(button => button.addEventListener('click', () => openEntity(button.dataset.openEntity)));
  const search = document.getElementById('entity-search');
  search?.addEventListener('input', event => { ui.search = event.target.value; const list = document.querySelector('.entity-list'); if (list) list.innerHTML = renderSidebarList(); document.querySelectorAll('[data-open-entity]').forEach(button => button.addEventListener('click', () => openEntity(button.dataset.openEntity))); });
  document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => handleAction(button.dataset.action)));
  document.querySelectorAll('[data-chat-action]').forEach(button => button.addEventListener('click', () => handleChatAction(button.dataset.chatAction)));
  document.querySelectorAll('[data-channel-action]').forEach(button => button.addEventListener('click', () => handleChannelAction(button.dataset.channelAction, button.dataset.id, button.dataset.reaction)));
  document.querySelectorAll('[data-call]').forEach(button => button.addEventListener('click', () => startCall(button.dataset.id, button.dataset.call)));
  document.querySelectorAll('[data-delete-message]').forEach(button => button.addEventListener('click', () => deleteMessage(button.dataset.deleteMessage)));
  document.querySelectorAll('[data-poll-vote]').forEach(button => button.addEventListener('click', () => votePoll(button.dataset.pollVote, Number(button.dataset.option))));
  const messageInput = document.getElementById('message-input');
  messageInput?.addEventListener('input', () => { messageInput.style.height='auto'; messageInput.style.height=`${Math.min(messageInput.scrollHeight,130)}px`; });
  messageInput?.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendCurrentMessage(); } });
  document.getElementById('app-theme')?.addEventListener('change', event => { state.settings.theme=event.target.value; saveState(); renderMain(); });
  document.getElementById('app-language')?.addEventListener('change', event => { state.language=event.target.value; saveState(); ensureAssistant(); renderMain(); });
  document.getElementById('notifications-toggle')?.addEventListener('change', handleNotificationToggle);
}

function openEntity(id) {
  const entity = getEntity(id); if (!entity) return;
  ui.tab = entity.type === 'channel' ? 'channels' : 'chats'; ui.selectedId = entity.id; ui.mobileContent=true; entity.unread=0; saveState(); renderMain();
}

function handleAction(action) {
  if (action === 'add') openAddMenu();
  else if (action === 'create-channel') openCreateEntity('channel');
  else if (action === 'mobile-back') { ui.selectedId=null; ui.chatMenu=false; renderMain(); }
  else if (action === 'chat-menu') { ui.chatMenu=!ui.chatMenu; renderMain(); }
  else if (action === 'attach') attachMediaToCurrentChat();
  else if (action === 'poll') openPollCreator();
  else if (action === 'send') sendCurrentMessage();
  else if (action === 'buy-premium') openPremiumPayment();
  else if (action === 'buy-stars') openStarsPayment();
  else if (action === 'status') openStatus();
  else if (action === 'install') installApp();
  else if (action === 'logout') confirmLogout();
  else if (action === 'open-assistant') openEntity('aquakotik-assistant');
  else if (action === 'assistant-tools') openAssistantTools();
}

function attachMediaToCurrentChat() {
  const entity = getEntity(ui.selectedId); if (!entity) return;
  pickImage(dataUrl => {
    const mediaField = dataUrl.startsWith('data:video') ? { video:dataUrl } : { image:dataUrl };
    addMessage(entity.id,{ sender:'me',...mediaField });
    if (entity.type !== 'assistant') scheduleReply(entity, state.language === 'ru' ? 'Посмотри отправленный файл.' : 'Please look at the attached file.');
    renderMain();
  });
}

function sendCurrentMessage() {
  const entity=getEntity(ui.selectedId); const input=document.getElementById('message-input');
  if (!entity || !input || entity.blocked) return;
  const text=input.value.trim(); if (!text) return;
  addMessage(entity.id,{sender:'me',text}); input.value=''; scheduleReply(entity,text); showToast(tx('sent'),tx('naturalReplyPending'),'check',2100); renderMain();
}

function openPollCreator() {
  const entity=getEntity(ui.selectedId); if (!entity) return;
  showModal({ title:tx('createPoll'), body:`<form id="poll-form"><div class="field"><label>${escapeHtml(tx('pollQuestion'))}</label><input id="poll-question" required maxlength="140"></div><div class="field" style="margin-top:12px"><label>${escapeHtml(tx('pollOptions'))}</label><textarea id="poll-options" required maxlength="600" placeholder="${state.language === 'ru' ? 'Первый вариант\nВторой вариант' : 'First option\nSecond option'}"></textarea></div></form>`, actions:`<button class="secondary-btn" type="button" data-close-modal>${escapeHtml(tx('cancel'))}</button><button class="primary-btn" type="submit" form="poll-form">${escapeHtml(tx('publish'))}</button>`, onReady(root){ root.querySelectorAll('[data-close-modal]').forEach(btn=>btn.addEventListener('click',closeModal)); root.querySelector('#poll-form').addEventListener('submit',event=>{ event.preventDefault(); const question=root.querySelector('#poll-question').value.trim(); const options=root.querySelector('#poll-options').value.split('\n').map(v=>v.trim()).filter(Boolean).slice(0,8); if (!question || options.length<2) return; addMessage(entity.id,{sender:'me',poll:{question,options:options.map(text=>({text,votes:0})),voted:null}}); closeModal(); renderMain(); }); }});
}

function votePoll(messageId, optionIndex) {
  const entity=getEntity(ui.selectedId); const message=getMessages(entity?.id).find(item=>item.id===messageId); if (!message?.poll) return;
  if (message.poll.voted != null) message.poll.options[message.poll.voted].votes=Math.max(0,(message.poll.options[message.poll.voted].votes||0)-1);
  if (message.poll.voted===optionIndex) message.poll.voted=null; else { message.poll.voted=optionIndex; message.poll.options[optionIndex].votes=(message.poll.options[optionIndex].votes||0)+1; }
  saveState(); renderMain();
}

function deleteMessage(messageId) {
  const entity=getEntity(ui.selectedId); if (!entity) return;
  state.messages[entity.id]=getMessages(entity.id).filter(message=>message.id!==messageId); saveState(); renderMain();
}

function scheduleReply(entity,prompt) {
  const max = entity.type === 'assistant' ? 1800 : 296000;
  const min = entity.type === 'assistant' ? 650 : 5000;
  state.scheduled.push({id:makeId('scheduled'),kind:'reply',entityId:entity.id,dueAt:Date.now()+min+Math.floor(Math.random()*max),prompt,createdAt:Date.now()}); saveState(); scheduleNextTick();
}

function scheduleProactive(entity) {
  if (entity.type === 'channel' || entity.type === 'assistant') return;
  state.scheduled.push({id:makeId('scheduled'),kind:'proactive',entityId:entity.id,dueAt:Date.now()+55000+Math.floor(Math.random()*125000),createdAt:Date.now()}); saveState(); scheduleNextTick();
}

function processScheduled() {
  const now=Date.now(); const due=state.scheduled.filter(item=>item.dueAt<=now); state.scheduled=state.scheduled.filter(item=>item.dueAt>now);
  for (const task of due) { const entity=getEntity(task.entityId); if (!entity || entity.blocked) continue; const text=task.kind==='proactive'?proactiveMessage(entity):makeLocalAiReply(task.prompt,entity); addMessage(entity.id,{sender:'them',text}); if (ui.selectedId!==entity.id || document.hidden) entity.unread=(entity.unread||0)+1; notifyUser(entity.title,text); }
  saveState(); if (due.length && sessionAuthenticated) renderMain(); scheduleNextTick();
}

function makeLocalAiReply(input,entity) {
  const ru=state.language==='ru'; const text=input.toLowerCase();
  if (entity.type==='assistant') {
    if (/исправ|ошиб|correct|grammar/.test(text)) return correctLocalText(input);
    if (/ответ|reply/.test(text)) return generateAssistantText(input,'reply');
    return generateAssistantText(input,'message');
  }
  const rules=[
    {k:['привет','hello','hi'],ru:'Привет. Рад, что ты написал. Как у тебя дела?',en:'Hello. Good to hear from you. How are you?'},
    {k:['как дела','how are'],ru:'Нормально, день довольно спокойный. А у тебя?',en:'I am doing well. It has been a calm day. How about you?'},
    {k:['встретим','meet'],ru:'Давай. Напиши, какое время тебе удобнее.',en:'Sure. Tell me what time works for you.'},
    {k:['спасибо','thank'],ru:'Пожалуйста. Обращайся.',en:'You are welcome.'},
    {k:['фото','video','видео','картин'],ru:'Посмотрел. Хорошо получилось.',en:'I looked at it. It turned out well.'},

function correctLocalText(source) {

let activeCallSession=null;
let callAudioContext=null;
let callTimers=[];

function startCall(entityId,type='audio') {
  const entity=getEntity(entityId); if (!entity || entity.type==='assistant' || entity.type==='channel') return;
  stopCallAudio(); callTimers.forEach(clearTimeout); callTimers=[];
  activeCallSession={entityId,type,startedAt:new Date().toISOString(),connectedAt:null,seconds:0,participants:[state.account.name]};
  modalRoot.innerHTML=`<div class="call-backdrop"><section class="call-screen"><div class="call-avatar">${entity.avatar?`<img src="${escapeHtml(entity.avatar)}" alt="">`:escapeHtml(initials(entity.title))}</div><h2>${escapeHtml(entity.title)}</h2><div id="call-state" class="call-state">${escapeHtml(tx('calling'))}</div><div id="call-participants" class="call-participants"><span class="call-participant">${escapeHtml(state.account.name)}</span></div><div class="call-controls"><button class="call-control" type="button" id="call-mic">${icon('mic')}</button>${type==='video'?`<button class="call-control" type="button" id="call-video">${icon('video')}</button>`:''}<button class="call-control end" type="button" id="call-end">${icon('phoneOff')}</button></div></section></div>`;
  playRingTone();
  modalRoot.querySelector('#call-end').addEventListener('click',endCall);
  callTimers.push(setTimeout(()=>connectCall(entity),2500));
}

function playRingTone() {
  try { callAudioContext=new (window.AudioContext||window.webkitAudioContext)(); const ring=()=>{ if(!callAudioContext)return; [0,.22].forEach(delay=>{const oscillator=callAudioContext.createOscillator();const gain=callAudioContext.createGain();oscillator.frequency.value=680;gain.gain.setValueAtTime(.0001,callAudioContext.currentTime+delay);gain.gain.exponentialRampToValueAtTime(.10,callAudioContext.currentTime+delay+.02);gain.gain.exponentialRampToValueAtTime(.0001,callAudioContext.currentTime+delay+.16);oscillator.connect(gain).connect(callAudioContext.destination);oscillator.start(callAudioContext.currentTime+delay);oscillator.stop(callAudioContext.currentTime+delay+.18);});};ring(); const interval=setInterval(ring,1300); callTimers.push(interval); } catch {}
}

function stopCallAudio(){ if(callAudioContext){callAudioContext.close().catch(()=>{});callAudioContext=null;} }

function connectCall(entity) {
  if(!activeCallSession)return; stopCallAudio(); activeCallSession.connectedAt=Date.now(); const stateNode=document.getElementById('call-state'); if(stateNode)stateNode.textContent=tx('connected');
  const timer=setInterval(()=>{if(!activeCallSession)return;activeCallSession.seconds+=1;const node=document.getElementById('call-state');if(node)node.textContent=`${tx('connected')} · ${Math.floor(activeCallSession.seconds/60)}:${String(activeCallSession.seconds%60).padStart(2,'0')}`;},1000);callTimers.push(timer);
  if(entity.type==='group'){ const memberEntities=(entity.members||[]).map(getEntity).filter(Boolean); memberEntities.slice(0,4).forEach((member,index)=>callTimers.push(setTimeout(()=>joinCallParticipant(member.title),3200+index*2600))); }
}

function joinCallParticipant(name){ if(!activeCallSession)return;activeCallSession.participants.push(name);const root=document.getElementById('call-participants');if(root)root.insertAdjacentHTML('beforeend',`<span class="call-participant">${escapeHtml(name)} · ${escapeHtml(tx('joinedCall'))}</span>`); }

function endCall(){ if(!activeCallSession)return; stopCallAudio();callTimers.forEach(clearInterval);callTimers=[];state.calls.unshift({id:makeId('call'),entityId:activeCallSession.entityId,title:getEntity(activeCallSession.entityId)?.title,type:activeCallSession.type,startedAt:activeCallSession.startedAt,duration:activeCallSession.seconds});state.calls=state.calls.slice(0,80);saveState();activeCallSession=null;closeModal();showToast(tx('ended'),'','call');if(sessionAuthenticated)renderMain(); }

async function handleNotificationToggle(event) {
  state.settings.notifications = Boolean(event.target.checked);
  saveState();
  if (!state.settings.notifications) {
    showToast(tx('notifications'), state.language === 'ru' ? 'Уведомления отключены.' : 'Notifications are disabled.', 'bell');
    return;
  }

  // In-app notifications work in every mode, including a directly opened HTML file.
  // System notifications are additionally requested when the browser permits them.
  let systemGranted = false;
  if (window.isSecureContext && 'Notification' in window) {
    try {
      const permission = Notification.permission === 'default'
        ? await Notification.requestPermission()
        : Notification.permission;
      systemGranted = permission === 'granted';
    } catch {}
  }

  showToast(
    tx('notificationEnabled'),
    systemGranted ? tx('inAppNotificationsEnabled') : tx('systemNotificationsBlocked'),
    'bell',
    5600
  );
  if (systemGranted) await notifyUser('AquaKotik', tx('testNotification'), { inApp: false });
}

async function notifyUser(title, body, options = {}) {
  if (!state.settings.notifications) return;

  // Always show a visible notification inside the application. This keeps the
  // feature functional even when the browser blocks the system Notification API.
  if (options.inApp !== false) showToast(title, body, 'bell', 5200);

  if (!window.isSecureContext || !('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const registration = 'serviceWorker' in navigator ? await navigator.serviceWorker.ready : null;
    if (registration) {
      await registration.showNotification(title, {
        body,
        icon: 'icons/icon-192.png',
        badge: 'icons/icon-192.png',
        tag: `aquakotik-${Date.now()}`,
        renotify: true
      });
    } else {
      new Notification(title, { body, icon: 'icons/icon-192.png' });
    }
  } catch {
    try { new Notification(title, { body, icon: 'icons/icon-192.png' }); } catch {}
  }
}
