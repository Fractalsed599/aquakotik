function channelSubscribers(channel) {
  const started = new Date(channel.createdAt || nowIso()).getTime();
  const elapsedMinutes = Math.max(0, Math.floor((Date.now() - started) / 60000));
  const rate = Number(channel.growthPerMinute || (channel.owner ? 0.18 : Math.max(.4,(channel.growthPerDay || 20)/1440)));
  const deterministic = Math.floor(elapsedMinutes * rate);
  return Math.max(0,(channel.baseSubscribers || (channel.owner ? 0 : 1)) + deterministic);
}

function ak3AutoPostText(channel, index) {
  const ru=state.language==='ru';
  const pools=ru ? [
    'Короткое обновление: в AquaKotik появились дополнительные настройки оформления и приватности.',
    'Новая заметка канала: спокойный интерфейс помогает быстрее находить нужные действия.',
    'Сегодня обсуждаем удобные способы хранить переписки и медиа локально.',
    'Пять минут прошли — время для новой публикации и свежего обновления канала.',
    'Подписчики постепенно присоединяются. Спасибо всем, кто читает и оставляет реакции.',
    'Совет дня: настройте тему, размер текста и звуки под свой стиль общения.',
    'Новая подборка: звонки, опросы, видеокружки и сообщения на время уже доступны в прототипе.'
  ] : [
    'Quick update: AquaKotik now has more appearance and privacy settings.',
    'Channel note: calm interfaces help people find actions faster.',
    'Today we discuss simple ways to keep conversations and media locally.',
    'Five minutes passed, so it is time for another channel update.',
    'Subscribers are joining gradually. Thank you for reading and reacting.',
    'Tip of the day: adjust themes, text size and sounds for your workflow.',
    'New selection: calls, polls, video circles and timed messages are available in the prototype.'
  ];
  return pools[Math.abs(simpleHash(channel.id+String(index)))%pools.length];
}
function ak3RefreshChannels(silent=false) {
  let changed=false;
  const now=Date.now();
  state.entities.filter(e=>e.type==='channel'&&!e.owner).forEach(channel=>{
    channel.posts=Array.isArray(channel.posts)?channel.posts:[];
    const last = Number(channel.lastAutoPostAt || new Date(channel.posts.at(-1)?.createdAt || channel.createdAt || now).getTime());
    const rawPeriods = Math.floor((now-last)/300000);
    const periods = Math.min(12,rawPeriods);
    if(periods<=0) return;
    for(let i=1;i<=periods;i+=1){
      const postTime=last+i*300000;
      const postIndex=channel.posts.length+i;
      const includePoll=postIndex%6===0;
      channel.posts.push({id:makeId('post'),text:ak3AutoPostText(channel,postIndex),poll:includePoll?{question:state.language==='ru'?'Какая функция вам полезнее?':'Which feature is most useful?',options:[{text:state.language==='ru'?'Звонки':'Calls',votes:3+postIndex%5},{text:state.language==='ru'?'Каналы':'Channels',votes:4+postIndex%4},{text:state.language==='ru'?'ИИ-ассистент':'Assistant',votes:6+postIndex%3}]}:null,createdAt:new Date(postTime).toISOString(),automatic:true});
    }
    channel.lastAutoPostAt=rawPeriods>12 ? now-(now%300000) : last+periods*300000;
    channel.reactions=channel.reactions||{heart:0,wave:0,check:0};
    channel.reactions.heart+=periods*(1+Math.abs(simpleHash(channel.id))%4);
    changed=true;
    if(channel.subscribed&&!silent) notifyUser(channel.title,tx('newChannelPost'));
  });
  if(changed){saveState();if(!silent&&sessionAuthenticated&&ui.tab==='channels')renderMain({preserveScroll:true});}
  return changed;
}

function ak3PruneExpired() {
  let changed=false;
  Object.keys(state.messages||{}).forEach(id=>{
    const before=state.messages[id].length;
    state.messages[id]=state.messages[id].filter(m=>!m.expiresAt||m.expiresAt>Date.now());
    if(before!==state.messages[id].length)changed=true;
  });
  if(changed)saveState();
}

function renderMessage(message) {

  const media=message.video?`<div class="${message.expiresAt?'timed-media':''}"><video class="message-video" src="${escapeHtml(message.video)}" controls playsinline></video></div>`:message.image?`<div class="${message.expiresAt?'timed-media':''}"><img class="message-image" src="${escapeHtml(message.image)}" alt="${escapeHtml(tx('photo'))}"></div>`:message.circle?`<video class="circle-video" src="${escapeHtml(message.circle)}" controls playsinline></video>`:message.audio?`<audio class="message-audio" src="${escapeHtml(message.audio)}" controls></audio>`:message.sticker?`<div class="sticker-message">${ak3StickerSvg(message.sticker)}</div>`:'';

function handleAction(action) {
  if(action==='add')openAddMenu();
  else if(action==='create-channel')openCreateEntity('channel');
  else if(action==='mobile-back'){ui.selectedId=null;ui.chatMenu=false;ui.stickerPicker=false;renderMain();}
  else if(action==='chat-menu'){ui.chatMenu=!ui.chatMenu;renderMain();}
  else if(action==='attach'||action==='media-menu')ak3OpenMediaMenu();
  else if(action==='smile-picker'){ui.stickerPicker=!ui.stickerPicker;renderMain({preserveScroll:true});}
  else if(action==='record-audio')ak3RecordAudio();
  else if(action==='record-circle')ak3RecordCircle();
  else if(action==='poll')openPollCreator();
  else if(action==='quick-poll'){const first=state.entities.find(e=>e.type!=='channel'&&e.type!=='assistant');if(first){ui.tab='chats';ui.selectedId=first.id;openPollCreator();}else showToast(tx('noContacts'),'','info');}
  else if(action==='send')sendCurrentMessage();
  else if(action==='buy-premium')openPremiumPayment();
  else if(action==='buy-stars')openStarsPayment();
  else if(action==='stars-center')ak3OpenStarsCenter();
  else if(action==='buy-verification')ak3BuyVerification();
  else if(action==='status')openStatus();
  else if(action==='install')installApp();
  else if(action==='logout')confirmLogout();
  else if(action==='open-assistant')openEntity('aquakotik-assistant');
  else if(action==='assistant-tools')openAssistantTools();
}

function ak3SendSticker(sticker){const entity=getEntity(ui.selectedId);if(!entity)return;addMessage(entity.id,{sender:'me',sticker});ui.stickerPicker=false;if(entity.type!=='assistant')scheduleReply(entity,state.language==='ru'?'Отправлен смайлик.':'A sticker was sent.');renderMain();}
function ak3ReadFile(file,max=18_000_000){return new Promise((resolve,reject)=>{if(!file||file.size>max){reject(new Error('size'));return;}const reader=new FileReader();reader.onerror=reject;reader.onload=()=>resolve(String(reader.result));reader.readAsDataURL(file);});}
function ak3PickFile(accept,callback){const input=document.createElement('input');input.type='file';input.accept=accept;input.onchange=async()=>{try{const file=input.files?.[0];if(!file)return;callback(await ak3ReadFile(file));}catch{showToast(state.language==='ru'?'Файл слишком большой или не поддерживается':'The file is too large or unsupported','','info');}};input.click();}

var ak3Recorder=null,ak3RecorderStream=null,ak3RecorderChunks=[];
async function ak3RecordAudio(){
  showModal({title:tx('recordAudio'),body:`<div class="recording-stage"><div class="recording-pulse" id="record-pulse">${icon('mic')}</div><strong id="record-label">${escapeHtml(tx('startRecording'))}</strong><span id="record-time">0:00</span></div>`,actions:`<button class="secondary-btn" type="button" data-close-modal>${escapeHtml(tx('cancel'))}</button><button class="primary-btn" type="button" id="record-toggle">${escapeHtml(tx('startRecording'))}</button>`,onReady(root){let started=0,timer=null;root.querySelectorAll('[data-close-modal]').forEach(b=>b.addEventListener('click',()=>{ak3StopRecorder(false);closeModal();}));root.querySelector('#record-toggle').addEventListener('click',async()=>{if(!ak3Recorder||ak3Recorder.state==='inactive'){try{ak3RecorderStream=await navigator.mediaDevices.getUserMedia({audio:true});ak3RecorderChunks=[];ak3Recorder=new MediaRecorder(ak3RecorderStream);ak3Recorder.ondataavailable=e=>{if(e.data.size)ak3RecorderChunks.push(e.data);};ak3Recorder.onstop=()=>{clearInterval(timer);const blob=new Blob(ak3RecorderChunks,{type:ak3Recorder.mimeType||'audio/webm'});const reader=new FileReader();reader.onload=()=>{const entity=getEntity(ui.selectedId);if(entity){addMessage(entity.id,{sender:'me',audio:String(reader.result)});saveState();showToast(tx('audioSent'),'','check');renderMain();}};reader.readAsDataURL(blob);ak3RecorderStream?.getTracks().forEach(t=>t.stop());ak3RecorderStream=null;};ak3Recorder.start();started=Date.now();root.querySelector('#record-pulse').classList.add('recording');root.querySelector('#record-label').textContent=tx('recordAudio');root.querySelector('#record-toggle').textContent=tx('stopAndSend');timer=setInterval(()=>{const sec=Math.floor((Date.now()-started)/1000);root.querySelector('#record-time').textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;if(sec>=60)ak3StopRecorder(true);},250);}catch{showToast(tx('cameraRequired'),'','info');}}else{ak3StopRecorder(true);closeModal();}});}});

async function ak3RecordCircle(){

  showModal({title:tx('recordCircle'),wide:true,body:`<div class="recording-stage"><video id="circle-preview" class="circle-preview" autoplay muted playsinline></video><strong id="circle-label">${escapeHtml(tx('camera'))}</strong><span id="circle-time">0:00</span></div>`,actions:`<button class="secondary-btn" type="button" id="circle-cancel">${escapeHtml(tx('cancel'))}</button><button class="primary-btn" type="button" id="circle-record">${escapeHtml(tx('startRecording'))}</button>`,onReady:async root=>{const cleanup=()=>{stream?.getTracks().forEach(t=>t.stop());};root.querySelector('#circle-cancel').addEventListener('click',()=>{cleanup();closeModal();});try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});root.querySelector('#circle-preview').srcObject=stream;}catch{root.querySelector('#circle-label').textContent=tx('cameraUnavailable');root.querySelector('#circle-record').disabled=true;return;}root.querySelector('#circle-record').addEventListener('click',()=>{if(!recorder){chunks=[];recorder=new MediaRecorder(stream);let started=Date.now(),timer;recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onstop=()=>{clearInterval(timer);const blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});const reader=new FileReader();reader.onload=()=>{const entity=getEntity(ui.selectedId);if(entity){addMessage(entity.id,{sender:'me',circle:String(reader.result)});saveState();showToast(tx('circleSent'),'','check');cleanup();closeModal();renderMain();}};reader.readAsDataURL(blob);};recorder.start();root.querySelector('#circle-record').textContent=tx('stopAndSend');timer=setInterval(()=>{const sec=Math.floor((Date.now()-started)/1000);root.querySelector('#circle-time').textContent=`0:${String(sec).padStart(2,'0')}`;if(sec>=15&&recorder.state==='recording')recorder.stop();},250);}else if(recorder.state==='recording')recorder.stop();});}});

function makeLocalAiReply(input,entity){
  const ru=state.language==='ru';const raw=String(input||'').trim();const text=raw.toLowerCase();const history=getMessages(entity.id).slice(-8).map(m=>m.text).filter(Boolean);
  if(entity.type==='assistant'){
    if(/исправ|ошиб|граммат|correct|grammar/.test(text))return correctLocalText(raw);
    if(/кратк|сократ|summar|short/.test(text))return ak3Summarize(raw);
    if(/вежлив|polite/.test(text))return ak3Polite(raw);
    if(/перев|translate/.test(text))return ak3TranslateDemo(raw);
    return ak3AssistantCompose(raw,'message');
  }
  const name=(entity.title||'').split(' ')[0];
  const arithmetic=text.match(/(?:сколько|calculate|посчитай)?\s*(-?\d+(?:[.,]\d+)?)\s*([+\-*\/])\s*(-?\d+(?:[.,]\d+)?)/);
  if(arithmetic){const a=Number(arithmetic[1].replace(',','.')),b=Number(arithmetic[3].replace(',','.'));let r;if(arithmetic[2]==='+')r=a+b;if(arithmetic[2]==='-')r=a-b;if(arithmetic[2]==='*')r=a*b;if(arithmetic[2]==='/')r=b? a/b:null;return r==null?(ru?'На ноль делить нельзя.':'Division by zero is not allowed.'):(ru?`Получается ${Number(r.toFixed(4))}.`:`The result is ${Number(r.toFixed(4))}.`);}
  const rules=[
    {re:/^(привет|здравств|добрый|hello|hi|hey)/,r:ru?`Привет. Рад тебя видеть. Что нового?`:`Hello. Good to hear from you. What is new?`},
    {re:/как дела|как ты|how are you/,r:ru?'Всё нормально. Сегодня дел много, но я на связи. Как ты?':'I am doing well. It is a busy day, but I am here. How are you?'},
    {re:/встрет|увид|meet/,r:ru?'Давай договоримся. Напиши день и примерное время, а я подтвержу.':'Let us arrange it. Send the day and approximate time, and I will confirm.'},
    {re:/звон|позвон|call/,r:ru?'Да, можем созвониться. Начни аудио- или видеозвонок кнопкой сверху.':'Yes, we can call. Start an audio or video call with the buttons above.'},
    {re:/спасибо|благодар|thank/,r:ru?'Пожалуйста. Рад, что помог.':'You are welcome. Glad I could help.'},
    {re:/извин|sorry/,r:ru?'Ничего страшного, всё в порядке.':'No problem, everything is fine.'},
    {re:/фото|картин|видео|audio|photo|image/,r:ru?'Файл получил. Выглядит понятно; если нужно, напиши, на что именно обратить внимание.':'I received the file. It looks clear; tell me what you want me to focus on.'},
    {re:/работ|проект|код|python|javascript|html/,r:ru?'Понял задачу. Я бы сначала разделил её на небольшие шаги, проверил главный сценарий, а затем занялся оформлением и редкими случаями.':'I understand the task. I would split it into small steps, verify the main flow, and then handle styling and edge cases.'},
    {re:/когда|время|сегодня|tomorrow|when/,r:ru?'Мне удобнее ближе к вечеру, но можно согласовать другое время.':'Evening works better for me, but we can choose another time.'},
    {re:/почему|зачем|why/,r:ru?'Думаю, причина в сочетании нескольких факторов. Расскажи контекст чуть подробнее, и я отвечу точнее.':'I think several factors are involved. Give me a little more context and I will answer more precisely.'},
    {re:/да\?|соглас|agree|okay|окей/,r:ru?'Да, согласен. Давай так и сделаем.':'Yes, I agree. Let us do that.'}
  ];
  const matched=rules.find(rule=>rule.re.test(text));if(matched)return matched.r;
  const follow=history.length&&/[?]$/.test(raw)?(ru?'Я понял вопрос. Если говорить по существу, я бы выбрал наиболее простой и надёжный вариант, а затем проверил результат на небольшом примере.':'I understand the question. I would choose the simplest reliable option and test it on a small example first.'):null;
  if(follow)return follow;
  const pool=ru?[`Понял тебя, ${name}. Звучит разумно. Расскажи, что хочешь сделать дальше.`,`Интересная мысль. Я бы ещё проверил детали, чтобы ничего не упустить.`,`Да, это можно сделать. Предлагаю начать с самого важного шага.`,`Я прочитал внимательно. В целом согласен, но есть несколько нюансов — можешь уточнить цель?`,`Хорошо. Я сохраню контекст разговора и отвечу точнее, когда появятся детали.`]:[`I understand, ${name}. That sounds reasonable. Tell me what you want to do next.`,`Interesting idea. I would verify the details so nothing is missed.`,`Yes, that can be done. I suggest starting with the most important step.`,`I read it carefully. I generally agree, but there are a few details. What is the goal?`,`All right. I will keep the conversation context and give a more precise answer when you add details.`];

  else{try{ak3CallStream=await navigator.mediaDevices.getUserMedia({audio:true});}catch{}}

function connectCall(entity){

}

function ak4HasRealContact() { return state.entities.some(e=>e.type==='chat' && e.id!=='aquakotik-assistant' && e.id!=='saved-messages'); }
function ak4EnsureSpecialChats() {
  const hasContact=ak4HasRealContact();
  if (!hasContact) {
    state.entities=state.entities.filter(e=>e.id!=='aquakotik-assistant'&&e.id!=='saved-messages');
    delete state.messages['aquakotik-assistant'];

  let assistant=state.entities.find(e=>e.id==='aquakotik-assistant');

    assistant={id:'aquakotik-assistant',type:'assistant',title:'Aqua AI',description:tx('assistantKnowledge'),createdAt:nowIso(),blocked:false,chatTheme:'violet',unread:0};
    state.entities.unshift(assistant);
    state.messages[assistant.id]=[{id:makeId('message'),sender:'them',senderName:'Aqua AI',text:state.language==='ru'?'Я помогу написать сообщение, исправить ошибки, объяснить тему, придумать идею или выполнить простое вычисление.':'I can write a message, correct mistakes, explain a topic, suggest an idea or do a simple calculation.',createdAt:nowIso()}];
  } else { assistant.title='Aqua AI';assistant.description=tx('assistantKnowledge'); }
}

function ak4Migrate() {
  state.activity=Array.isArray(state.activity)?state.activity:[];
  state.reels=Array.isArray(state.reels)?state.reels:[];
  state.interests=state.interests&&typeof state.interests==='object'?state.interests:{};
  state.aquaCard={owned:false,balanceH:0,...(state.aquaCard||{})};
  state.settings={activityImportantOnly:false,discoverCategory:-1,...(state.settings||{})};
  if(state.account && !('avatar' in state.account)) state.account.avatar=null;

function makeLocalAiReply(input,entity){
  const ru=state.language==='ru';const raw=String(input||'').trim();const text=raw.toLowerCase();
  if(entity.type==='saved')return '';
  if(entity.type!=='assistant'){
    if(/привет|hello|hi|здрав/.test(text))return ru?'Привет. Я на связи. Как у тебя дела?':'Hi. I am here. How are you?';
    if(/как дела|how are/.test(text))return ru?'Нормально, спасибо. Сейчас немного занят, но могу поговорить.':'I am doing well, thanks. A little busy, but I can chat.';
    if(/фото|video|видео|картин/.test(text))return ru?'Посмотрел. Получилось интересно, особенно детали на фоне.':'I looked at it. It came out well, especially the background details.';
    if(/встреч|созвон|call|meet/.test(text))return ru?'Да, давай. Напиши удобное время, и я постараюсь подключиться.':'Sure. Send a convenient time and I will try to join.';
    if(/спасибо|thank/.test(text))return ru?'Пожалуйста. Рад, что пригодилось.':'You are welcome. Glad it helped.';
    if(/\?$/.test(raw))return ru?'Хороший вопрос. Я бы сначала уточнил детали, а затем выбрал самый простой и надёжный вариант. Что для тебя важнее всего?':'Good question. I would first clarify the details, then choose the simplest reliable option. What matters most to you?';
    const humanRu=['Понял тебя. Думаю, это можно сделать без лишней сложности.','Интересная мысль. Дай мне немного времени, я ещё обдумаю детали.','Да, звучит разумно. Я бы начал с небольшого шага и посмотрел на результат.','Согласен. Особенно важно не торопиться и проверить всё по порядку.'];
    const humanEn=['I understand. I think it can be done without unnecessary complexity.','Interesting idea. Give me a little time to think through the details.','That sounds reasonable. I would start with a small step and check the result.','Agreed. It is especially important to test everything in order.'];
    return (ru?humanRu:humanEn)[Math.abs(simpleHash(raw+entity.id))%4];
  }
  if(!raw)return ru?'Напишите вопрос или вставьте текст, который нужно улучшить.':'Write a question or paste text you want to improve.';
  if(/исправ|ошиб|граммат|correct|grammar/.test(text))return correctLocalText(raw.replace(/^(исправь|исправить|correct)[:\s-]*/i,''));
  if(/сократ|кратк|summar|short/.test(text))return ak3Summarize(raw);
  if(/вежлив|polite/.test(text))return ak3Polite(raw);
  if(/перев|translate/.test(text))return ak3TranslateDemo(raw);
  const expr=raw.match(/(?:сколько|calculate|посчитай)?\s*([0-9\s+\-*/().]{3,})/i)?.[1];
  if(expr&&/^[0-9\s+\-*/().]+$/.test(expr)){try{const value=Function(`"use strict";return (${expr})`)();if(Number.isFinite(value))return `${expr.trim()} = ${value}`;}catch{}}
  if(/python|питон|код|program|javascript|sql/.test(text))return ru?'Сначала сформулируйте входные данные и ожидаемый результат. Затем разбейте задачу на небольшие функции, добавьте проверку ошибок и протестируйте крайние случаи. Для точного примера пришлите код или структуру данных.':'First define the input and expected result. Then split the task into small functions, add error handling and test edge cases. Send the code or data structure for a precise example.';
  if(/иде|назван|сценар|idea|name|script/.test(text))return ru?'Предлагаю три направления: спокойное и понятное, необычное с контрастом и короткое с сильным первым кадром. Для AquaKotik лучше всего работает сочетание мягкого визуального стиля и очень ясного действия.':'I suggest three directions: calm and clear, unusual with contrast, and short with a strong opening. AquaKotik works best with gentle visuals and a very clear action.';
  if(/объясни|что такое|explain|what is/.test(text))return ru?'Объясню простыми словами: сначала определите основную идею, затем посмотрите, из каких частей она состоит и как эти части связаны. После этого полезно разобрать один конкретный пример. Уточните термин, и я дам более точное объяснение.':'In simple terms: identify the main idea, then see what parts it contains and how they connect. After that, work through one concrete example. Tell me the exact term for a more precise explanation.';
  if(/план|plan/.test(text))return ru?'План: 1) определить результат; 2) собрать ограничения; 3) сделать минимальную рабочую версию; 4) проверить основные сценарии; 5) исправить ошибки; 6) улучшить внешний вид и удобство.':'Plan: 1) define the result; 2) collect constraints; 3) build a minimum working version; 4) test core scenarios; 5) fix bugs; 6) improve appearance and usability.';
  return ru?`Я понял запрос: «${raw.slice(0,180)}». Основной ответ зависит от цели и ограничений. Я бы начал с самого простого проверяемого варианта, сравнил результат с ожиданиями и только потом добавлял сложные функции. Можете уточнить контекст, и я дам конкретные шаги.`:`I understand the request: “${raw.slice(0,180)}”. The best answer depends on the goal and constraints. I would start with the simplest testable option, compare the result with expectations, and only then add complex features. Add context and I will give concrete steps.`;
}

function processScheduled(){
  const now=Date.now();const due=state.scheduled.filter(item=>item.dueAt<=now);state.scheduled=state.scheduled.filter(item=>item.dueAt>now);
  for(const task of due){const entity=getEntity(task.entityId);if(!entity||entity.blocked||entity.type==='saved')continue;const text=task.kind==='proactive'?proactiveMessage(entity):makeLocalAiReply(task.prompt,entity);if(!text)continue;const payload={sender:'them',text};if(entity.type==='group'){const members=(entity.members||[]).map(getEntity).filter(Boolean);const sender=members[Math.abs(simpleHash(task.id))%Math.max(1,members.length)]||{title:state.language==='ru'?'Участник':'Member'};payload.senderName=sender.title;payload.senderAvatar=sender.avatar;}else payload.senderName=entity.title;addMessage(entity.id,payload);if(ui.selectedId!==entity.id||document.hidden)entity.unread=(entity.unread||0)+1;ak4Log('message',entity.title,text,true,entity.id);notifyUser(entity.title,text);}
  saveState();if(due.length&&sessionAuthenticated)renderMain({preserveScroll:true});scheduleNextTick();

function ak4MakeDemoWav(seconds=2){
  const rate=8000,samples=rate*seconds,buffer=new ArrayBuffer(44+samples*2),view=new DataView(buffer);const write=(o,s)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};write(0,'RIFF');view.setUint32(4,36+samples*2,true);write(8,'WAVE');write(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,rate,true);view.setUint32(28,rate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);write(36,'data');view.setUint32(40,samples*2,true);for(let i=0;i<samples;i++){const amp=Math.sin(i/13)*Math.exp(-i/(rate*.8))*.09;view.setInt16(44+i*2,amp*32767,true);}return new Blob([buffer],{type:'audio/wav'});
}
ak3RecordAudio = function(){
  let recorder=null, stream=null, chunks=[], timer=null, started=0, mode='idle', closed=false;
  const cleanup=()=>{ clearInterval(timer); timer=null; stream?.getTracks().forEach(track=>track.stop()); stream=null; };
  showModal({
    title:tx('recordAudio'),
    body:`<div class="recording-stage"><div class="recording-pulse" id="record-pulse">${icon('mic')}</div><strong id="record-label">${escapeHtml(tx('startRecording'))}</strong><span id="record-time">0:00</span><p id="record-note"></p></div>`,
    actions:`<button class="secondary-btn" type="button" data-close-modal>${escapeHtml(tx('cancel'))}</button><button class="primary-btn" type="button" id="record-toggle">${escapeHtml(tx('startRecording'))}</button>`,
    onReady(root){
      const el=id=>root.isConnected?root.querySelector(id):null;
      const closeSafely=()=>{ closed=true; cleanup(); closeModal(); };
      const finish=blob=>{
        const reader=new FileReader();
        reader.onload=()=>{
          if(closed) return;
          const entity=getEntity(ui.selectedId);
          if(entity){
            addMessage(entity.id,{sender:'me',audio:String(reader.result)});
            ak4Log('message',state.account.name,tx('audioMessage'),false,entity.id);
            saveState();
          }
          closed=true; cleanup(); closeModal(); showToast(tx('audioSent'),'','check'); renderMain();
        };
        reader.onerror=()=>{ closed=true; cleanup(); closeModal(); showToast(tx('recordingFallback'),'','info'); };
        reader.readAsDataURL(blob);
      };
      const stopAndSend=()=>{
        if(mode==='done') return;
        mode='done'; clearInterval(timer); timer=null;
        const button=el('#record-toggle'); if(button) button.disabled=true;
        if(recorder && recorder.state==='recording'){
          recorder.onstop=()=>{ const mime=recorder.mimeType||'audio/webm'; finish(new Blob(chunks,{type:mime})); };
          recorder.stop();
        } else {
          finish(ak4MakeDemoWav(Math.max(1,Math.min(4,Math.floor((Date.now()-started)/1000)||1))));
        }
      };
      root.querySelectorAll('[data-close-modal]').forEach(button=>button.addEventListener('click',closeSafely));
      const toggle=el('#record-toggle');
      toggle?.addEventListener('click',async event=>{
        if(mode==='idle'){
          mode='requesting'; started=Date.now(); event.currentTarget.disabled=true; event.currentTarget.textContent=`${tx('startRecording')}…`;
          try{
            if(!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder==='undefined') throw new Error('media unavailable');
            stream=await navigator.mediaDevices.getUserMedia({audio:true});
            if(closed || !root.isConnected){ cleanup(); return; }
            const preferred=MediaRecorder.isTypeSupported?.('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'';
            recorder=new MediaRecorder(stream,preferred?{mimeType:preferred}:undefined);
            recorder.ondataavailable=e=>{ if(e.data?.size) chunks.push(e.data); };
            recorder.start();
          } catch(error){
            cleanup();
            const note=el('#record-note'); if(note) note.textContent=tx('recordingFallback');
          }
          if(closed || !root.isConnected) return;
          mode='recording';
          const pulse=el('#record-pulse'); if(pulse) pulse.classList.add('recording');
          const label=el('#record-label'); if(label) label.textContent=tx('recording');
          const button=el('#record-toggle'); if(button){ button.disabled=false; button.textContent=tx('stopAndSend'); }
          timer=setInterval(()=>{
            if(closed || !root.isConnected){ cleanup(); return; }
            const time=el('#record-time'); if(!time) return;
            const seconds=Math.floor((Date.now()-started)/1000);
            time.textContent=`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;
          },250);
        } else if(mode==='recording') stopAndSend();
      });
    }
  });
};

function akLiveCode(){
  state.account=state.account||{};
  if(!state.account.aquaCode){
    const seed=`${state.account.email||state.account.name||'ak'}-${Date.now()}-${Math.random()}`;
    state.account.aquaCode=`AK${Math.abs(simpleHash(seed)).toString(36).toUpperCase().padStart(6,'0').slice(0,6)}`;
    saveState();
  }
  return state.account.aquaCode;
}

const akLive={
  server:false, source:null, heartbeat:null, typingTimer:null,
  url(){return location.protocol==='file:'?'http://localhost:8787':location.origin;},
  async post(path,payload){
    const response=await fetch(`${this.url()}${path}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!response.ok)throw new Error('server unavailable');
    return response.json();
  },
  async presence(online=true,typingTo=null){
    if(!state.account)return;
    try{
      await this.post('/api/presence',{code:akLiveCode(),name:state.account.name,avatar:state.account.avatar,online,typingTo});
      this.server=true;
    }catch{this.server=false;}
  },
  connect(){
    if(!state.account||this.source)return;
    try{
      this.source=new EventSource(`${this.url()}/api/events`);
      this.source.addEventListener('open',()=>{this.server=true;this.presence(true);renderMain({preserveScroll:true});});
      this.source.addEventListener('error',()=>{this.server=false;renderMain({preserveScroll:true});});
      this.source.addEventListener('snapshot',event=>this.merge(JSON.parse(event.data||'{}')));
      this.source.addEventListener('presence',event=>this.applyPresence(JSON.parse(event.data||'{}')));
      this.source.addEventListener('message',event=>this.incoming(JSON.parse(event.data||'{}')));
      this.source.addEventListener('contact',event=>this.contact(JSON.parse(event.data||'{}')));
    }catch{this.server=false;}
    clearInterval(this.heartbeat);
    this.heartbeat=setInterval(()=>this.presence(true),20000);
  },
  merge(snapshot){
    state.liveUsers=snapshot.users||{};
    state.livePresence=snapshot.presence||{};
    (snapshot.messages||[]).forEach(message=>this.incoming(message,true));
    (snapshot.contacts||[]).forEach(contact=>this.contact(contact,true));
    saveState();
    if(sessionAuthenticated)renderMain({preserveScroll:true});
  },
  contact(payload,silent=false){
    if(!payload||!payload.fromCode)return;
    if(payload.fromCode===state.account?.aquaCode)return;
    const existing=state.entities.find(e=>(payload.entityId&&e.id===payload.entityId)||e.contactCode===payload.fromCode);
    if(existing){
      if(!existing.avatar&&payload.avatar){existing.avatar=payload.avatar;saveState();}
      if(!silent&&sessionAuthenticated)renderMain({preserveScroll:true});
      return;
    }
    const entity={id:payload.entityId||makeId('chat'),type:'chat',title:payload.title||state.liveUsers?.[payload.fromCode]?.name||payload.fromCode,avatar:payload.avatar||null,createdAt:payload.createdAt||nowIso(),blocked:false,chatTheme:'ocean',unread:1,description:payload.fromCode,phone:payload.fromCode,contactCode:payload.fromCode};
    state.entities.push(entity);state.messages[entity.id]=[];ak4EnsureSpecialChats();saveState();
    if(!silent)showToast(tx('contactAdded'),entity.title,'chats');
    if(sessionAuthenticated)renderMain({preserveScroll:true});
  },
  applyPresence(payload){
    state.liveUsers=state.liveUsers||{};
    state.livePresence=state.livePresence||{};
    if(payload.user)state.liveUsers[payload.user.code]=payload.user;
    if(payload.presence)state.livePresence[payload.presence.code]=payload.presence;
    saveState();
    if(sessionAuthenticated)renderMain({preserveScroll:true});
  },
  incoming(message,silent=false){
    if(!message||message.fromCode===state.account?.aquaCode)return;
    // Exact entity id first (groups/channels), then the 1-on-1 fallback by sender code.
    // Without this, group messages from a user we also chat 1-on-1 with leak into the contact chat.
    let entity=state.entities.find(e=>e.id===message.entityId);
    if(!entity&&message.toCode)entity=state.entities.find(e=>e.contactCode===message.fromCode);
    if(!entity)return;
    const list=getMessages(entity.id);
    if(list.some(item=>item.serverId===message.id))return;
    addMessage(entity.id,{sender:'them',senderName:state.liveUsers?.[message.fromCode]?.name||entity.title,text:message.text,createdAt:message.createdAt,serverId:message.id});
    if(ui.selectedId!==entity.id)entity.unread=(entity.unread||0)+1;
    if(!silent)showToast(tx('newMessageActivity'),entity.title,'chats');
    saveState();
    if(sessionAuthenticated)renderMain({preserveScroll:true});
  }
};

const akBasePublishAdminConfig=akPublishAdminConfig;

  if(form){
    let list=Array.isArray(next.announcements)?next.announcements.slice():((state.adminConfig?.announcements)||[]).slice();

.ak-gs-avatar{width:64px;height:64px;border-radius:20px;border:1px dashed rgba(7,152,170,.4);background:rgba(7,152,170,.06);display:grid;place-items:center;overflow:hidden;cursor:pointer;padding:0;flex:0 0 auto}
.ak-gs-avatar img{width:100%;height:100%;object-fit:cover}
.ak-gs-avatar svg{width:26px;height:26px;color:var(--brand)}
.ak-gs-section{border-top:1px solid var(--line);padding-top:12px}
.ak-gs-section h4{margin:0 0 10px;font-size:13px;color:var(--ink)}
.ak-invite-box{display:flex;gap:8px;align-items:center}
.ak-invite-box input{flex:1;min-width:0;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.ak-gs-switches{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:9px}
.ak-add-member{display:flex;gap:8px;margin-top:10px}
.ak-add-member input{flex:1;min-width:0}
.ak-member-list{display:grid;gap:6px;max-height:230px;overflow:auto}
.ak-member-row{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:12px;background:rgba(7,152,170,.05)}
.ak-member-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#0aa8b8,#064a68);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:900;flex:0 0 auto}
.ak-member-copy{flex:1;min-width:0}
.ak-member-copy strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ak-member-copy small{color:var(--ink-soft);font-size:11px}
.ak-role-badge{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:rgba(7,152,170,.12);color:var(--brand-strong);flex:0 0 auto}
.ak-role-badge.owner{background:rgba(245,158,11,.16);color:#b45309}
.ak-role-badge.admin{background:rgba(139,92,246,.14);color:#6d28d9}
.ak-member-row .icon-btn{width:28px;height:28px;flex:0 0 auto}
.ak-pin-post{display:flex;gap:8px;margin-bottom:10px}
.ak-pin-post select{flex:1;min-width:0}
.ak-gs-section.danger{display:flex;justify-content:flex-end}
`;
document.head.appendChild(akGroupStyle);

const akGroups={
  code(){return akLiveCode();},
  post(payload){return akLive.post('/api/group',payload);},
  fetchByCode(code){return fetch(`${akLive.url()}/api/group?code=${encodeURIComponent(code)}`).then(r=>r.json()).catch(()=>null);},
  myRole(record){const m=(record?.members||[]).find(x=>x.code===this.code());return m?.role||null;},
  role(entity){
    if(entity.groupRole)return entity.groupRole;
    if(entity.serverGroup)return 'member';
    return 'owner';
  },
  isManager(entity){const r=this.role(entity);return r==='owner'||r==='admin';},
  inviteFor(entity){return entity?.invite&&entity.invite.code?entity.invite:{code:null,enabled:true};},
  linkFor(entity){const invite=this.inviteFor(entity);return invite.code?`${akLive.url()}/?join=${invite.code}`:'';},
  parseInput(text){
    const value=String(text||'').trim();
    const match=value.match(/join=([A-Za-z0-9]+)/i);
    if(match)return match[1].toUpperCase();
    if(/^[A-Za-z0-9]{3,24}$/.test(value))return value.toUpperCase();
    return null;
  },
  syncGroup(record,silent=false,note='',memberCode=''){
    if(!record||!record.id)return null;
    let entity=state.entities.find(e=>e.id===record.id);
    const mine=this.myRole(record);
    // Only show groups/channels the user actually belongs to (or owns). Public ones stay joinable by link, but must not pollute every chat list.
    const visible=Boolean(mine)||record.ownerCode===this.code();
    if(!visible){
      if(entity){state.entities=state.entities.filter(e=>e.id!==record.id);delete state.messages[record.id];saveState();}
      if(!silent&&sessionAuthenticated)renderMain({preserveScroll:true});
      return null;
    }
    if(!entity){
      entity={id:record.id,type:record.type==='channel'?'channel':'group',title:record.title,avatar:record.avatar||null,createdAt:record.createdAt,blocked:false,chatTheme:'ocean',unread:note==='joined'?0:1,description:record.description||'',serverGroup:true,owner:record.ownerCode===this.code()};
      state.entities.push(entity);
      state.messages[entity.id]=state.messages[entity.id]||[];
      ak4EnsureSpecialChats();
    }
    entity.title=record.title;
    entity.avatar=record.avatar||entity.avatar;
    entity.description=record.description||entity.description||'';
    entity.groupMembers=(record.members||[]).map(m=>({...m}));
    entity.members=(record.members||[]).map(m=>m.code);
    entity.groupRole=this.myRole(record);
    entity.invite={code:record.invite?.code||null,enabled:record.invite?.enabled!==false};
    entity.public=Boolean(record.public);
    entity.owner=record.ownerCode===this.code();
    entity.pinnedMessage=record.pinned?{...record.pinned}:null;
    if(entity.type==='channel'&&typeof entity.subscribed!=='boolean')entity.subscribed=Boolean(entity.owner||mine);
    saveState();
    if(!silent&&sessionAuthenticated){
      if(note==='joined')showToast(tx('joinedGroup'),entity.title,'check');
      else if(note==='member-added'&&memberCode&&memberCode===this.code())showToast(tx('invitedToGroup'),entity.title,'users');
      renderMain({preserveScroll:true});
    }
    return entity;
  },
  open(entityId){
    const entity=getEntity(entityId);
    if(!entity)return;
    entity.unread=0;
    if(entity.type==='channel'){ui.tab='channels';ui.selectedId=entity.id;ui.mobileContent=true;}
    else{ui.tab='chats';ui.selectedId=entity.id;ui.mobileContent=true;}
    saveState();renderMain({preserveScroll:true});
  },
  async joinByInput(text){
    const code=this.parseInput(text);
    if(!code){showToast(tx('joinLinkInvalid'),'','info');return false;}
    const data=await this.fetchByCode(code);
    if(!data?.record){showToast(tx('joinNotFound'),code,'info');return false;}
    const record=data.record;
    if(this.myRole(record)){
      showToast(tx('alreadyInGroup'),record.title,'info');
      this.open(record.id);
      return true;
    }
    if(!record.public||!record.invite?.enabled){showToast(tx('joinDisabled'),record.title,'shield');return false;}
    let joined=null;
    try{joined=(await this.post({action:'join',entityId:record.id,code:this.code(),name:state.account?.name||''})).record||null;}catch{}
    const optimistic={...record,members:[...(record.members||[]),{code:this.code(),name:state.account?.name||'',role:'member',joinedAt:nowIso()}]};
    this.syncGroup(joined||optimistic,false,'joined');
    // Load the group's existing history so the chat is not empty right after joining.
    try{
      const snap=await (await fetch(`${akLive.url()}/api/state`)).json();
      (snap?.messages||[]).filter(m=>m.entityId===record.id).forEach(m=>{try{akLive.incoming(m,true);}catch{}});
    }catch{}
    this.open(record.id);
    return true;
  },
  handleJoinUrl(){
    try{
      const params=new URLSearchParams(location.search);
      const join=params.get('join')||params.get('invite');
      if(!join||!sessionAuthenticated)return;
      history.replaceState({},'',location.pathname);
      this.joinByInput(join);
    }catch{}
  },
  pinMessage(entity,message){
    const payload={action:'pin',entityId:entity.id,byCode:this.code(),messageId:message.id,text:message.text||'',senderName:state.account?.name||'',createdAt:message.createdAt};
    entity.pinnedMessage={id:message.id,text:payload.text,senderName:payload.senderName,createdAt:message.createdAt};
    saveState();
    this.post(payload).then(r=>{if(r?.record)this.syncGroup(r.record,true);}).catch(()=>{});
    showToast(tx('pinSaved'),entity.title,'check');
    renderMain({preserveScroll:true});
  },
  unpinMessage(entity){
    entity.pinnedMessage=null;
    saveState();
    this.post({action:'pin',entityId:entity.id,byCode:this.code(),messageId:''}).then(r=>{if(r?.record)this.syncGroup(r.record,true);}).catch(()=>{});
    showToast(tx('pinRemoved'),entity.title,'close');
    renderMain({preserveScroll:true});
  },
  confirmDelete(entity){
    closeModal();
    showModal({
      title:tx('deleteGroup'),
      subtitle:entity.title,
      body:`<div class="info-banner">${icon('trash')}<span>${escapeHtml(tx('deleteGroupConfirm'))}</span></div>`,
      actions:`<button class="secondary-btn" type="button" data-close-modal>${escapeHtml(tx('cancel'))}</button><button class="danger-btn" id="ak-gs-confirm-delete" type="button">${escapeHtml(tx('deleteGroup'))}</button>`,
      onReady(root){
        root.querySelectorAll('[data-close-modal]').forEach(btn=>btn.addEventListener('click',closeModal));
        root.querySelector('#ak-gs-confirm-delete')?.addEventListener('click',()=>{
          akGroups.post({action:'delete',entityId:entity.id,byCode:akGroups.code()}).then(()=>{
            state.entities=state.entities.filter(e=>e.id!==entity.id);
            delete state.messages[entity.id];
            saveState();
            closeModal();
            showToast(tx('groupDeleted'),entity.title,'trash');
            if(ui.selectedId===entity.id)ui.selectedId=null;
            renderMain({preserveScroll:true});
          }).catch(()=>{closeModal();showToast(tx('liveOffline'),tx('serverHint'),'info');});
        });
      }
    });
  },
  openInviteModal(entity){
    const invite=akGroups.inviteFor(entity);
    if(!invite.code){openInvitation(entity);return;}
    const link=akGroups.linkFor(entity);
    showModal({
      title:tx('inviteLink'),
      subtitle:entity.title,
      body:`<div class="ak-gs"><p style="margin:0;color:var(--ink-soft);line-height:1.5">${escapeHtml(tx('joinByLinkHint'))}</p><div class="ak-invite-box"><input id="ak-inv-link" readonly value="${escapeHtml(link)}"><button class="secondary-btn" id="ak-inv-copy" type="button">${icon('copy')}<span>${escapeHtml(tx('copyLink'))}</span></button></div></div>`,
      actions:`<button class="secondary-btn" type="button" data-close-modal>${escapeHtml(tx('cancel'))}</button><button class="primary-btn" id="ak-inv-close" type="button">${icon('check')}<span>${escapeHtml(tx('saved'))}</span></button>`,
      onReady(root){
        root.querySelectorAll('[data-close-modal]').forEach(btn=>btn.addEventListener('click',closeModal));
        root.querySelector('#ak-inv-close')?.addEventListener('click',closeModal);
        root.querySelector('#ak-inv-copy')?.addEventListener('click',async()=>{
          try{await navigator.clipboard.writeText(link);}catch{}
          showToast(tx('copied'),invite.code||'','copy');
        });
      }
    });
  },
  openCreateGroupOrChannel(type){
    const isChannel=type==='channel';
    let avatar=null;
    showModal({
      title:isChannel?tx('createChannel'):tx('createGroup'),
      subtitle:isChannel?tx('createChannelHint'):tx('createGroupHint'),
      wide:true,
      body:`<form id="ak-group-form" class="form-grid">
        <div class="field full"><label>${escapeHtml(isChannel?tx('channelName'):tx('groupName'))}</label><input id="ak-g-title" required maxlength="48"></div>
        <div class="field full"><label>${escapeHtml(tx('description'))} (${escapeHtml(tx('optional'))})</label><textarea id="ak-g-desc" maxlength="300"></textarea></div>
        <div class="field full"><label>${escapeHtml(tx('photo'))} (${escapeHtml(tx('optional'))})</label><button class="upload-preview" id="ak-g-avatar" type="button"><span>${icon('upload')}<span>${escapeHtml(tx('uploadImage'))}</span></span></button></div>
        <div class="field full"><label>${escapeHtml(tx('participants'))} (${escapeHtml(tx('optional'))})</label><input id="ak-g-first-code" maxlength="16" placeholder="${escapeHtml(tx('addByCodeHint'))}"></div>
        ${isChannel?`<div class="field full"><label class="switch-label"><input id="ak-g-public" type="checkbox" checked><span>${escapeHtml(tx('publicChannel'))}</span></label></div>`:''}
      </form>`,
      actions:`<button class="secondary-btn" type="button" data-close-modal>${escapeHtml(tx('cancel'))}</button><button class="primary-btn" type="submit" form="ak-group-form">${icon('check')}<span>${escapeHtml(isChannel?tx('createChannel'):tx('createGroup'))}</span></button>`,
      onReady(root){
        root.querySelectorAll('[data-close-modal]').forEach(btn=>btn.addEventListener('click',closeModal));
        root.querySelector('#ak-g-avatar').addEventListener('click',()=>pickImage(dataUrl=>{
          avatar=dataUrl;
          root.querySelector('#ak-g-avatar').innerHTML=`<img src="${escapeHtml(dataUrl)}" alt="">`;
        }));
        root.querySelector('#ak-group-form').addEventListener('submit',async event=>{
          event.preventDefault();
          const titleValue=root.querySelector('#ak-g-title').value.trim();
          if(!titleValue)return;
          const description=root.querySelector('#ak-g-desc').value.trim();
          const publicValue=isChannel?Boolean(root.querySelector('#ak-g-public').checked):true;
          const firstCode=akGroups.parseInput(root.querySelector('#ak-g-first-code')?.value||'');
          const id=makeId(isChannel?'channel':'group');
          const entity={id,type,title:titleValue,avatar,createdAt:nowIso(),blocked:false,chatTheme:'ocean',unread:0,description,serverGroup:true,owner:true,public:publicValue,invite:{code:null,enabled:true}};
          state.entities.push(entity);
          state.messages[id]=[];
          ak4EnsureSpecialChats();
          saveState();
          try{
            const created=(await akGroups.post({action:'create',entityId:id,type,title:titleValue,description,avatar,ownerCode:akGroups.code(),ownerName:state.account?.name||'',public:publicValue})).record||null;
            if(created)akGroups.syncGroup(created,true);
            if(firstCode){
              try{
                const added=(await akGroups.post({action:'member-add',entityId:id,byCode:akGroups.code(),code:firstCode,name:''})).record||null;
                if(added)akGroups.syncGroup(added,true);
              }catch{}
            }
          }catch{}
          closeModal();
          showToast(tx('created'),titleValue,'check');
          if(type==='channel'){ui.tab='channels';ui.selectedId=null;ui.mobileContent=true;}
          else{ui.tab='chats';ui.selectedId=id;ui.mobileContent=true;}
          saveState();
          renderMain();
          window.setTimeout(()=>akGroups.openInviteModal(getEntity(id)||entity),350);
        });
      }
    });
  },
  openJoinByLink(){
    showModal({
      title:tx('joinByLink'),
      subtitle:tx('joinByLinkHint'),
      body:`<form id="ak-join-form"><div class="field"><label>${escapeHtml(tx('inviteLink'))}</label><input id="ak-join-input" required maxlength="300" placeholder="http://localhost:8787/?join=AKG123456"></div></form>`,
      actions:`<button class="secondary-btn" type="button" data-close-modal>${escapeHtml(tx('cancel'))}</button><button class="primary-btn" type="submit" form="ak-join-form">${icon('link')}<span>${escapeHtml(tx('joinByLink'))}</span></button>`,
      onReady(root){
        root.querySelectorAll('[data-close-modal]').forEach(btn=>btn.addEventListener('click',closeModal));
        root.querySelector('#ak-join-form').addEventListener('submit',async event=>{
          event.preventDefault();
          const ok=await akGroups.joinByInput(root.querySelector('#ak-join-input').value);
          if(ok)closeModal();
        });
      }
    });
  },
  openGroupSettings(entity){
    const manager=akGroups.isManager(entity);
    const isChannel=entity.type==='channel';
    const avatar=entity.avatar||null;
    const members=(entity.groupMembers||[]).map(m=>({...m}));
    const invite=akGroups.inviteFor(entity);
    const link=akGroups.linkFor(entity);
    const roleLabel=role=>role==='owner'?tx('roleOwner'):role==='admin'?tx('roleAdmin'):tx('roleMember');
    showModal({
      title:isChannel?tx('channelSettings'):tx('groupSettings'),
      subtitle:tx('groupSettingsHint'),
      wide:true,
      body:`<div class="ak-gs">
        <div class="ak-gs-head"><button class="ak-gs-avatar" id="ak-gs-avatar" type="button" ${manager?'':'tabindex="-1"'}>${entity.avatar?`<img src="${escapeHtml(entity.avatar)}" alt="">`:`<span>${icon(isChannel?'channel':'users')}</span>`}</button><div><h3>${escapeHtml(entity.title)}</h3><span>${escapeHtml(members.length?`${members.length} ${tx('members')}`:tx('noMembersYet'))}</span></div></div>
        <form id="ak-gs-form" class="form-grid">
          <div class="field"><label>${escapeHtml(tx('name'))}</label><input id="ak-gs-title" required maxlength="48" value="${escapeHtml(entity.title)}" ${manager?'':'disabled'}></div>
          <div class="field"><label>${escapeHtml(tx('description'))}</label><textarea id="ak-gs-desc" maxlength="300" ${manager?'':'disabled'}>${escapeHtml(entity.description||'')}</textarea></div>
          <div class="field full"><label>${escapeHtml(tx('inviteLink'))}</label><div class="ak-invite-box"><input id="ak-gs-link" readonly value="${escapeHtml(link||'—')}" ${invite.code?'':'disabled'}><button class="secondary-btn" id="ak-gs-copy-link" type="button" ${invite.code?'':'disabled'}>${icon('copy')}<span>${escapeHtml(tx('copyLink'))}</span></button></div>
          ${manager?`<div class="ak-gs-switches"><label class="switch-label"><input id="ak-gs-link-enabled" type="checkbox" ${invite.enabled!==false?'checked':''}><span>${escapeHtml(tx('inviteEnabled'))}</span></label><button class="ghost-btn" id="ak-gs-regen" type="button">${icon('qr')}<span>${escapeHtml(tx('regenerateLink'))}</span></button></div>`:''}
          </div>
          ${isChannel&&manager?`<div class="field full"><label class="switch-label"><input id="ak-gs-public" type="checkbox" ${entity.public!==false?'checked':''}><span>${escapeHtml(tx('publicChannel'))}</span></label></div>`:''}
        </form>
        <div class="ak-gs-section"><h4>${escapeHtml(tx('participants'))} · ${members.length||'—'}</h4>
          <div class="ak-member-list">${members.length?members.map(m=>`<div class="ak-member-row"><span class="ak-member-avatar">${escapeHtml((m.name||m.code).slice(0,1).toUpperCase())}</span><div class="ak-member-copy"><strong>${escapeHtml(m.name||m.code)}${m.code===akGroups.code()?` (${escapeHtml(tx('you'))})`:''}</strong><small>${escapeHtml(m.code)}</small></div><span class="ak-role-badge ${escapeHtml(m.role||'member')}">${escapeHtml(roleLabel(m.role))}</span>${manager&&m.role!=='owner'?`<button class="icon-btn" type="button" data-ak-member-role="${escapeHtml(m.code)}" aria-label="${escapeHtml(m.role==='admin'?tx('removeAdmin'):tx('makeAdmin'))}">${icon('shield')}</button><button class="icon-btn" type="button" data-ak-member-remove="${escapeHtml(m.code)}" aria-label="${escapeHtml(tx('memberRemoved'))}">${icon('close')}</button>`:''}</div>`).join(''):`<small>${escapeHtml(tx('noMembersYet'))}</small>`}</div>
          ${manager?`<div class="ak-add-member"><input id="ak-gs-add-code" maxlength="16" placeholder="${escapeHtml(tx('addByCodeHint'))}"><button class="primary-btn" id="ak-gs-add" type="button">${icon('plus')}<span>${escapeHtml(tx('addMember'))}</span></button></div>`:''}
        </div>
        <div class="ak-gs-section"><h4>${escapeHtml(tx('pinnedMessage'))}</h4>
          ${isChannel&&manager?`<div class="ak-pin-post"><select id="ak-gs-pin-post">${(entity.posts||[]).map(p=>`<option value="${escapeHtml(p.id)}">${escapeHtml((p.text||'…').slice(0,90))}</option>`).join('')}</select><button class="secondary-btn" id="ak-gs-pin" type="button">📌<span>${escapeHtml(tx('pinMessage'))}</span></button></div>`:''}
          ${entity.pinnedMessage?`<div class="ak-pin-banner inline"><span class="ak-pin-icon">📌</span><div class="ak-pin-copy"><small>${escapeHtml(tx('pinnedMessage'))}${entity.pinnedMessage.senderName?` · ${escapeHtml(entity.pinnedMessage.senderName)}`:''}</small><p>${escapeHtml((entity.pinnedMessage.text||'').slice(0,300))}</p></div>${manager?`<button class="icon-btn" id="ak-gs-unpin" type="button" aria-label="${escapeHtml(tx('unpinMessage'))}">${icon('close')}</button>`:''}</div>`:`<small>${escapeHtml(tx('noPinned'))}</small>`}
        </div>
        ${!isChannel?`<div class="ak-gs-section danger">${akGroups.role(entity)!=='owner'?`<button class="danger-btn" id="ak-gs-leave" type="button">${icon('back')}<span>${escapeHtml(tx('leaveGroup'))}</span></button>`:`<button class="danger-btn" id="ak-gs-delete" type="button">${icon('trash')}<span>${escapeHtml(tx('deleteGroup'))}</span></button>`}</div>`:''}
      </div>`,
      actions:`<button class="secondary-btn" type="button" data-close-modal>${escapeHtml(tx('cancel'))}</button>${manager?`<button class="primary-btn" type="submit" form="ak-gs-form">${escapeHtml(tx('save'))}</button>`:''}`,
      onReady(root){
        root.querySelectorAll('[data-close-modal]').forEach(btn=>btn.addEventListener('click',closeModal));
        root.querySelector('#ak-gs-avatar')?.addEventListener('click',()=>{
          if(!manager)return;
          pickImage(dataUrl=>{
            avatar=dataUrl;
            root.querySelector('#ak-gs-avatar').innerHTML=`<img src="${escapeHtml(dataUrl)}" alt="">`;
          });
        });
        root.querySelector('#ak-gs-copy-link')?.addEventListener('click',async()=>{
          try{await navigator.clipboard.writeText(link);}catch{}
          showToast(tx('copied'),invite.code||'','copy');
        });
        root.querySelector('#ak-gs-form')?.addEventListener('submit',event=>{
          event.preventDefault();
          if(!manager){closeModal();return;}
          const titleValue=root.querySelector('#ak-gs-title').value.trim()||entity.title;
          const descValue=root.querySelector('#ak-gs-desc').value.trim();
          const linkEnabled=Boolean(root.querySelector('#ak-gs-link-enabled')?.checked);
          const publicValue=isChannel?Boolean(root.querySelector('#ak-gs-public')?.checked):undefined;
          entity.title=titleValue;
          entity.description=descValue;
          entity.avatar=avatar;
          if(publicValue!==undefined)entity.public=publicValue;
          entity.invite={...invite,enabled:linkEnabled};
          saveState();
          const payload={action:'config',entityId:entity.id,byCode:akGroups.code(),title:titleValue,description:descValue,avatar};
          if(publicValue!==undefined)payload.public=publicValue;
          akGroups.post(payload).then(r=>{if(r?.record)akGroups.syncGroup(r.record,true);}).catch(()=>{});
          if(linkEnabled!==(invite.enabled!==false)){
            akGroups.post({action:'invite',entityId:entity.id,byCode:akGroups.code(),enabled:linkEnabled}).then(r=>{if(r?.record)akGroups.syncGroup(r.record,true);}).catch(()=>{});
          }
          closeModal();
          showToast(tx('saved'),entity.title,'check');
          renderMain({preserveScroll:true});
        });
        root.querySelector('#ak-gs-regen')?.addEventListener('click',()=>{
          akGroups.post({action:'invite',entityId:entity.id,byCode:akGroups.code(),regen:true}).then(r=>{
            if(r?.record){
              akGroups.syncGroup(r.record,true);
              closeModal();
              showToast(tx('linkRegenerated'),'','copy');
              renderMain({preserveScroll:true});
            }
          }).catch(()=>showToast(tx('liveOffline'),tx('serverHint'),'info'));
        });
        root.querySelectorAll('[data-ak-member-role]').forEach(btn=>btn.addEventListener('click',()=>{
          const code=btn.dataset.akMemberRole;
          const member=members.find(m=>m.code===code);
          if(!member)return;
          const newRole=member.role==='admin'?'member':'admin';
          member.role=newRole;
          entity.groupMembers=members;
          saveState();
          akGroups.post({action:'member-role',entityId:entity.id,byCode:akGroups.code(),code,role:newRole}).then(r=>{
            if(r?.record)akGroups.syncGroup(r.record,true);
            renderMain({preserveScroll:true});
          }).catch(()=>{closeModal();renderMain({preserveScroll:true});});
        }));
        root.querySelectorAll('[data-ak-member-remove]').forEach(btn=>btn.addEventListener('click',()=>{
          const code=btn.dataset.akMemberRemove;
          const index=members.findIndex(m=>m.code===code);
          if(index<0)return;
          members.splice(index,1);
          entity.groupMembers=members;
          saveState();

/* ================= AquaKotik 4.2 — input stability fixes: no echo re-renders, drafts survive ================= */
// 1) The server broadcasts our own presence back to us (typing + 20s heartbeat).
//    Re-rendering on our own echo wiped the message input while typing. Ignore it.
const akBaseApplyPresence=akLive.applyPresence;
akLive.applyPresence=function(payload){
  if(payload&&payload.presence&&payload.presence.code&&state.account&&payload.presence.code===state.account.aquaCode)return;
  return akBaseApplyPresence.call(this,payload);
};
// 2) Throttle typing reports: one presence POST per contact every 800ms, not per keystroke.
const akBasePresence=akLive.presence;
akLive.presence=async function(online=true,typingTo=null){
  if(typingTo){
    const now=Date.now();
    if(this._typingSentTo===typingTo&&this._typingSentAt&&now-this._typingSentAt<800)return;
    this._typingSentTo=typingTo;this._typingSentAt=now;
  }else{this._typingSentTo=null;}
  return akBasePresence.call(this,online,typingTo);
};
// 3) Safety net: any re-render (incoming message, contact, presence of others, admin config)
//    must not destroy the text the user is currently typing in the composer.
const akBaseRenderMainStable=renderMain;
renderMain=function(options={}){
  const input=document.getElementById('message-input');
  const draft=input?input.value:'';
  const hadFocus=Boolean(input&&document.activeElement===input);
  let caret=null;
  if(hadFocus){try{caret=input.selectionStart;}catch{}}
  const selBefore=ui.selectedId,tabBefore=ui.tab;
  const result=akBaseRenderMainStable(options);
  if(draft&&ui.selectedId===selBefore&&ui.tab===tabBefore){
    const again=document.getElementById('message-input');
    if(again){
      again.value=draft;
      if(hadFocus&&document.activeElement!==again){
        try{again.focus({preventScroll:true});}catch{again.focus();}
        if(caret!=null){try{again.setSelectionRange(caret,caret);}catch{}}
      }
    }
  }
  return result;
};

  const d=now||new Date();
  const cur=d.getHours()*60+d.getMinutes();
  const from=toMin(schedule.from),to=toMin(schedule.to);
  if(from==null||to==null)return {open:true,until:null};
  const open=from<=to?(cur>=from&&cur<to):(cur>=from||cur<to);
  let until=to>from?to:to+1440;
  if(until<=cur)until+=1440;
  const hh=String(Math.floor((until%1440)/60)).padStart(2,'0');
  const mm=String(until%60).padStart(2,'0');
  return {open,until:hh+':'+mm};
}

function ak43ApplyCosmetics(){
  if(!state.account)return;
  /* 4.6: merge local-over-server so a freshly changed font/accent applies immediately
     (previously it read the stale server copy before the async sync resolved). */
  const prof=Object.assign({},ak43MyProfile().profile||{},state.account.profile||{font:'system',accent:'ocean'});
  const font=AK43_FONTS[prof.font]||'';
  try{document.body.style.fontFamily=font;}catch{}
  const acc=AK43_ACCENTS[prof.accent];
  try{
    if(acc){
      document.body.setAttribute('data-ak43-accent',prof.accent);
      document.body.style.setProperty('--brand',acc[0]);
      document.body.style.setProperty('--brand-strong',acc[1]);
      document.body.style.setProperty('--brand-dark',acc[2]);
    }else{
      document.body.removeAttribute('data-ak43-accent');
      document.body.style.removeProperty('--brand');
      document.body.style.removeProperty('--brand-strong');
      document.body.style.removeProperty('--brand-dark');

async function ak43SyncUser(patch){

function ak43BuyPremium(){
  const stars=Number(state.stars||0);
  if(stars<AK43_PREMIUM_PRICE){
    showToast(t('Не хватает звёзд','Not enough stars'),t(`Нужно ${AK43_PREMIUM_PRICE}⭐, у вас ${stars}⭐. Попросите админа пополнить баланс в профиле.`,AK43_PREMIUM_PRICE+' stars needed, you have '+stars+'. Ask the admin for a top-up in profile.'),'star');
    return;
  }
  state.stars=stars-AK43_PREMIUM_PRICE;
  const base=Math.max(Date.now(),state.premiumUntil?new Date(state.premiumUntil).getTime():0);
  state.premium=true;
  state.premiumUntil=new Date(base+365*86400000).toISOString();
  saveState();
  ak43SyncUser({premiumUntil:state.premiumUntil,stars:state.stars});
  ak43ApplyCosmetics();
  showToast(t('Premium активирован','Premium activated'),t('1 год Premium · шрифт, акцент, расписание, безлимит контактов','1 year of Premium · font, accent, schedule, unlimited contacts'),'star');

function ak43BotBind(){

    b.addEventListener('click',()=>{
      const a=b.dataset.ak43;const d=ak43BotDraft;

        if(a==='bot-close'){ak43BotClose();return;}
        ak43BotStep=Math.max(0,ak43BotStep-1);ak43BotRender();return;
      }
      if(a==='bot-next'){
        if(ak43BotStep===0){
          d.name=(document.getElementById('ak43-bot-name')?.value||'').trim();
        }
        if(ak43BotStep===1){
          d.name=(document.getElementById('ak43-bot-name')?.value||'').trim();

        }
        if(ak43BotStep===2){
          ak43CollectRule(el,0,d.rules[0]);
        }
        ak43BotStep++;ak43BotRender();return;
      }
      if(a==='bot-emoji'){d.emoji=b.dataset.emoji;ak43BotRender();return;}
      if(a==='bot-save'){ak43BotSave();return;}
      if(a==='rule-addbtn'){d.rules[Number(b.dataset.idx)].buttons=d.rules[Number(b.dataset.idx)].buttons||[];if(d.rules[Number(b.dataset.idx)].buttons.length<3){d.rules[Number(b.dataset.idx)].buttons.push({label:'',text:''});ak43BotRender();}return;}
      if(a==='rule-del'){if(d.rules.length>1){d.rules.splice(Number(b.dataset.idx),1);ak43BotRender();}else showToast(t('Оставьте хотя бы один блок','Keep at least one block'),'','info');return;}
      if(a==='rule-new'){if(d.rules.length<12){d.rules.push({when:{kind:'contains',text:''},reply:'',buttons:[]});ak43BotRender();}else showToast(t('Максимум 12 блоков','Max 12 blocks'),'','info');return;}
      if(a==='preview-send'){ak43PreviewSend();return;}
      if(a==='invite-copy'){const code=d.botCode?ak43InviteLink(d.botCode):'';if(code){navigator.clipboard?.writeText(code).catch(()=>{});showToast(t('Ссылка скопирована','Link copied'),code,'link');}return;}
      if(a==='bot-join-group'){
        const g=document.getElementById('ak43-bot-group');
        if(g&&d.botCode){
          akLive.post('/api/bot',{action:'join-group',code:d.botCode,entityId:g.value,byCode:myCode()}).then(r=>{
            if(r&&r.record)akGroups.syncGroup(r.record,true);

    el.querySelectorAll('[data-ak43r]').forEach(inp=>{
      const idx=Number(inp.dataset.ak43r);

      if(!rule)return;
      if(inp.classList.contains('ak43-block-kind'))return;

        return;
      }
      if(inp.dataset.ak43f==='text')rule.when.text=inp.value;
    });
  };
  el.addEventListener('input',syncRule);
  if(ak43BotStep===2)ak43PreviewSeed();
}
function ak43CollectRule(el,idx,rule){
  el.querySelectorAll(`[data-ak43r="${idx}"]`).forEach(inp=>{
    if(inp.classList.contains('ak43-block-kind'))rule.when.kind=inp.value;
    else if(inp.classList.contains('ak43-block-reply'))rule.reply=inp.value;
    else if(inp.dataset.ak43b!=null){
      rule.buttons[Number(inp.dataset.ak43b)][inp.dataset.ak43f==='label'?'label':'text']=inp.value;
    }
    else if(inp.dataset.ak43f==='text')rule.when.text=inp.value;
  });
  rule.buttons=(rule.buttons||[]).filter(b=>b.label||b.text);
}

function ak43PreviewSend(){
  const inp=document.getElementById('ak43-preview-in');
  const chat=document.getElementById('ak43-preview-chat');
  if(!inp||!chat)return;
  const text=inp.value.trim();
  if(!text)return;
  inp.value='';
  chat.insertAdjacentHTML('beforeend',ak43PreviewBubble('me',text));
  const d=JSON.parse(JSON.stringify(ak43BotDraft));
  d.rules.forEach(r=>ak43CollectRule(ak43BotOverlay,r===ak43BotDraft.rules[0]?0:ak43BotDraft.rules.indexOf(r),r));
  const bot={name:d.name||'bot',rules:d.rules};
  const rule=ak43MatchRule(bot,text);
  const reply=rule?rule.reply:(t('…я ещё учусь! Добавьте блок под это слово.','…I’m still learning! Add a block for this word.'));
  setTimeout(()=>{
    chat.insertAdjacentHTML('beforeend',ak43PreviewBubble('them',reply));
    chat.scrollTop=chat.scrollHeight;
  },380);
  chat.scrollTop=chat.scrollHeight;
}
function ak43BotSave(){
  const d=ak43BotDraft;
  const el=ak43BotOverlay;
  d.rules.forEach((r,i)=>ak43CollectRule(el,i,r));
  d.rules=d.rules.filter(r=>r.reply||r.buttons.length);
  if(!d.rules.length){showToast(t('Боту нужен хотя бы один блок с ответом','The bot needs at least one block with a reply'),'','info');return;}
  if(!d.name){showToast(t('Дайте боту имя','Name your bot'),'','info');return;}
  const payload=d.botCode
    ?{action:'update',code:d.botCode,byCode:myCode(),name:d.name,emoji:d.emoji,rules:d.rules}
    :{action:'create',byCode:myCode(),name:d.name,emoji:d.emoji,rules:d.rules,ownerName:state.account.name};
  fetch(`${origin()}/api/bot`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(r=>r.json())
    .then(data=>{
      if(!data||!data.bot){showToast(t('Не вышло','Failed'),(data&&data.error)||'','block');return;}
      state.bots=state.bots||{};state.bots[data.bot.code]=data.bot;
      const e=ak43BotEntity(data.bot);
      saveState();
      ak43BotClose();
      openEntity(e.id);
      showToast(t('Бот готов! 🎉','Bot is ready! 🎉'),t('Поговорите с ним прямо сейчас — и отправьте ссылку друзьям','Chat with it now — and share the invite link with friends'),'star');
    })
    .catch(()=>showToast(t('Сервер недоступен','Server offline'),t('Запустите сервер и попробуйте ещё раз','Start the server and try again'),'block'));
}

function ak43DeleteBot(code){
  if(!window.confirm(t('Удалить бота? Ссылки перестанут работать.','Delete this bot? Its invite links will stop working.')))return;
  fetch(`${origin()}/api/bot`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'delete',code,byCode:myCode()})})
    .then(r=>r.json())
    .then(data=>{
      if(!data||!data.ok)return;
      state.bots=state.bots||{};delete state.bots[code];
      const e=state.entities.find(x=>x.botCode===code);
      if(e){
        state.entities=state.entities.filter(x=>x!==e);
        delete state.messages[e.id];
        if(ui.selectedId===e.id)ui.selectedId=null;
      }
      saveState();
      showToast(t('Бот удалён','Bot deleted'),'','trash');
      renderMain();
    })
    .catch(()=>showToast(t('Не вышло','Failed'),'','block'));

/* ================= AquaKotik 4.4 — star cosmetics · gender line · bot chip · dark theme repair v2 ================= */

/* ---------- Cosmetics you can buy with stars ---------- */
const AK44_COSMETICS=[
  {id:'gold-frame',icon:'👑',price:250,ru:'Золотая рамка аватара',en:'Golden avatar frame'},
  {id:'name-sparkle',icon:'✨',price:150,ru:'Искра в вашем имени',en:'Sparkle next to your name'},
  {id:'bubble-wave',icon:'🌊',price:200,ru:'Акварельное кольцо ваших сообщений',en:'Aqua ring on your messages'}
];
const ak44Owned=()=>new Set(state.account&&Array.isArray(state.account.cosmetics)?state.account.cosmetics:[]);
function ak44ApplyCosmetics(){
  if(!state.account)return;
  const owned=ak44Owned();
  document.body.classList.toggle('ak44-gold-frame',owned.has('gold-frame'));
  document.body.classList.toggle('ak44-name-sparkle',owned.has('name-sparkle'));
  document.body.classList.toggle('ak44-bubble-wave',owned.has('bubble-wave'));
}
async function ak44BuyCosmetic(id){
  const item=AK44_COSMETICS.find(c=>c.id===id);
  if(!item)return;
  const owned=ak44Owned();
  if(owned.has(id)){showToast(t('Уже куплено','Already owned'),'','check');return;}
  const stars=Number(state.stars||0);
  if(stars<item.price){
    showToast(t('Не хватает звёзд','Not enough stars'),t(`Нужно ${item.price}⭐, у вас ${stars}⭐. Попросите админа пополнить баланс в профиле.`,'Need '+item.price+' stars, you have '+stars+'. Ask the admin for a top-up in profile.'),'star');
    return;
  }
  state.stars=stars-item.price;
  state.account.cosmetics=Array.from(owned).concat(id);
  saveState();
  await ak43SyncUser({cosmetics:state.account.cosmetics,stars:state.stars});
  ak44ApplyCosmetics();
  showToast(t('Косметика куплена!','Cosmetic purchased!'),item.icon+' '+t(item.ru,item.en),'star');
  if(ui.tab==='profile')renderMain();
}

      const g=state.account.gender||((state.liveUsers||{})[myCode()]||{}).gender||'none';

      out=base.slice(0,secEnd)+'</section>'+`<div class="ak44-gender-now">${t('Ваш пол','Your gender')}: <strong>${escapeHtml(label)}</strong></div>`+base.slice(secEnd);
    }
  }
  const owned=ak44Owned();
  /* 4.6: clean emoji-free showcase — SVG icons + tidy product tiles */
  const cosIcon={ 'gold-frame':'crown','name-sparkle':'sparkle','bubble-wave':'wave' };

  function ak45MediaFromServer(m){

    if(!entity&&message.toCode)entity=state.entities.find(e=>e.contactCode===message.fromCode);
    if(entity&&!byId&&!isMe(message.toCode))return; /* someone else's 1-on-1 message, not addressed to me */
    if(!entity){
      /* Not mine, not addressed to me -> invisible to this client. */
      if(!(message.toCode&&isMe(message.toCode)))return;
      const profile=(state.liveUsers||{})[message.fromCode]||{};
      entity={
        id:makeId('chat'),type:'chat',

        description:message.fromCode,phone:message.fromCode,
        contactCode:message.fromCode,ownedByMe:true

      state.entities.push(entity);
      state.messages[entity.id]=[];

    }

  let ak45CleanToastShown=false;
  function ak45CleanEntities(){
    if(!sessionAuthenticated||!state.account)return;
    let removed=0;

    const candidates=state.entities.filter(e=>e.type==='chat'&&e.contactCode&&!botLike(e.contactCode));
    const toDrop=candidates.filter(e=>!e.ownedByMe&&!getMessages(e.id).some(m=>m.sender==='me'));
    if(toDrop.length){
      state.entities=state.entities.filter(e=>!toDrop.includes(e));
      toDrop.forEach(e=>{delete state.messages[e.id];});
      removed+=toDrop.length;
      if(ui.selectedId&&toDrop.some(e=>e.id===ui.selectedId))ui.selectedId=null;
    }
    /* Orphan server-groups: local entity claims serverGroup, but the server has no such group. */
    const serverGroups=window.__ak45ServerGroups;
    if(serverGroups){
      state.entities.filter(e=>(e.type==='group'||e.type==='channel')&&e.serverGroup).forEach(e=>{
        if(!serverGroups[e.id]&&Date.now()-(new Date(e.createdAt||0).getTime())>5*60*1000){

  function ak45BindAdminForms(){

        if(ta)ta.value='';
        showToast(t('Анонс отправлен всем ✓','Announcement sent to everyone ✓'),'','check');
        if(res&&res.item)ak45ShowAnnounce(res.item);
      }).catch(()=>{});

    document.querySelector('#ak45-poll-form')?.addEventListener('submit',e=>{
      e.preventDefault();

  /* ---------- 6) Gift stars: now real (server-side transfer) ---------- */
  openGiftStars=function(entity){
    if(!entity)return;
    const balance=Number(state.stars||0);
    const isUser=entity.contactCode&&!botLike(entity.contactCode);
    const hintText=isUser
      ? t('Звёзды списнутся с вашего баланса и сразу появятся у получателя (на любом его устройстве).','Stars will be deducted from your balance and immediately appear on the recipient (on any of their devices).')
      : t('Звёзды списываются с вашего баланса.','Stars are deducted from your balance.');
    const hintHtml='<p style="margin:0 0 10px;color:var(--ink-soft);font-size:12.5px">'+escapeHtml(hintText)+'</p>';
    const choicesHtml=[10,25,50,100].map(n=>'<button class="choice-card" type="button" data-ak45-gift-amt="'+n+'">⭐ '+n+'</button>').join('');
    showModal({
      title:tx('giftStars'),
      subtitle:tx('balance')+': '+balance+'⭐ '+(isUser?('→ '+escapeHtml(entity.title)):''),
      body:hintHtml+'<div class="choice-grid">'+choicesHtml+'</div>',
      actions:`<button class="secondary-btn" type="button" data-close-modal>${escapeHtml(tx('cancel'))}</button>`,
      onReady(root){
        root.querySelectorAll('[data-close-modal]').forEach(b=>b.addEventListener('click',closeModal));
        root.querySelectorAll('[data-ak45-gift-amt]').forEach(b=>b.addEventListener('click',()=>{
          const amount=Number(b.dataset.ak45GiftAmt);
          if(amount>balance){showToast(tx('notEnoughStars'),'','star');return;}
          if(isUser){
            closeModal();
            akLive.post('/api/gift',{code:myCode(),toCode:entity.contactCode,amount}).then(res=>{
              if(res&&res.from){state.stars=res.from.stars;saveState();}
              showToast(t('Подарок отправлен ✓','Gift sent ✓'),`${amount}⭐ → ${entity.title}`,'star');
              renderMain({preserveScroll:true});
            }).catch(()=>{});
            return;
          }
          /* Non-user chats (assistant etc.) keep the local behaviour */
          state.stars=Math.max(0,state.stars-amount);
          addMessage(entity.id,{system:true,text:t(`Подарено ${amount} Aqua Stars.`,`${amount} Aqua Stars were gifted.`)});
          saveState();closeModal();showToast(tx('starsGifted'),`${amount}`,'star');renderMain();
        }));
      }
    });
  };

  /* ---------- 7) Mobile / phone install hint ---------- */
  window.addEventListener('beforeinstallprompt',e=>{
    try{e.preventDefault();window.__ak45DeferredPrompt=e;}catch{}
  });
  function ak45InjectMobileInstall(){
    if(document.getElementById('ak45-install-hint'))return;
    try{
      if(sessionStorage.getItem('ak45-install-dismissed'))return;
      const coarse=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches;
      const fine=window.matchMedia&&window.matchMedia('(pointer:fine)').matches;
      const standalone=window.matchMedia&&window.matchMedia('(display-mode:standalone)').matches;
      if(standalone||(!coarse&&fine))return; /* desktop gets the normal install button */
      const secure=location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
      const canReal=Boolean(window.__ak45DeferredPrompt);
      const hintText=canReal
        ? t('Нажмите кнопку ниже — AquaKotik установится на главный экран как обычное приложение.','Press the button below — AquaKotik will be installed to your home screen like a regular app.')
        : secure
          ? t('Нажмите кнопку ниже (Android: «Добавить на главный экран»). На iPhone: браузер Safari → Поделиться → «На экран».','Press the button below (Android: "Add to Home screen"). On iPhone: Safari → Share → "Add to Home Screen".')
          : t('Чтобы установить на телефон по ссылке, сервер должен быть с HTTPS (см. README-DEPLOY.md). Сейчас: iPhone Safari → Поделиться → «На экран»; Android: меню → «Добавить на главный экран».','To install on a phone by link, the server needs HTTPS (see README-DEPLOY.md). For now: iPhone Safari → Share → "Add to Home Screen"; Android: menu → "Add to home screen".');
      const el=document.createElement('div');
      el.id='ak45-install-hint';
      el.className='ak45-install-hint';
      el.innerHTML=`<div><strong>📱 ${escapeHtml(t('AquaKotik на телефоне / планшете','AquaKotik on phone / tablet'))}</strong><p>${escapeHtml(hintText)}</p></div>
        <button type="button" data-ak45="install-go">${escapeHtml(canReal||secure?t('Установить','Install'):'Понятно')}</button>
        <button type="button" class="ghost" data-ak45="install-dismiss">✕</button>`;
      el.querySelector('[data-ak45="install-dismiss"]').addEventListener('click',()=>{
        try{sessionStorage.setItem('ak45-install-dismissed','1');}catch{}
        el.remove();
      });
      el.querySelector('[data-ak45="install-go"]').addEventListener('click',()=>{
        try{
          if(window.__ak45DeferredPrompt){
            window.__ak45DeferredPrompt.prompt();
            window.__ak45DeferredPrompt.userChoice?.then?.(()=>{window.__ak45DeferredPrompt=null;});
          }else{
            try{installApp();}catch{}
          }
        }catch{}
        try{sessionStorage.setItem('ak45-install-dismissed','1');}catch{}
        el.remove();
      });
      const shell=document.querySelector('.messenger-shell');
      if(shell)shell.prepend(el);
    }catch{}
  }

  /* ---------- 8) renderMain wrapper: nav tab + post-render bindings ---------- */
  const akBaseRenderMain45=renderMain;
  renderMain=function(options){
    const out=akBaseRenderMain45.call(this,options);
