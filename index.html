/* ---------- user / badge helpers ---------- */
function myCode(){try{return akLiveCode();}catch(e){return (state.account&&state.account.aquaCode)||'';}}
function userRec(code){
  if(!code)return null;
  if(code===myCode()){
    return Object.assign({},state.account||{},{code,verified:!!(state.verified&&state.verified.purchased&&state.verified.enabled),premium:!!state.premium});
  }
  return (state.liveUsers||{})[code]||null;
}
const AK47_ADMIN=(function(){try{return (window.AQUAKOTIK_FIREBASE&&window.AQUAKOTIK_FIREBASE.adminEmail||'irontim88@gmail.com').toLowerCase();}catch(e){return 'irontim88@gmail.com';}})();
function isAdminCode(code){const r=userRec(code);return !!(r&&r.email&&String(r.email).toLowerCase()===AK47_ADMIN);}
function verifiedSvg(){return '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="verified-fill" d="M12 1.6l2.6 2 3.3-.3 1 3.2 2.9 1.8-1.1 3.1 1.1 3.1-2.9 1.8-1 3.2-3.3-.3-2.6 2-2.6-2-3.3.3-1-3.2-2.9-1.8 1.1-3.1L2.2 8.4l2.9-1.8 1-3.2 3.3.3z"/><path class="verified-check" d="M8.2 12.3l2.6 2.6 4.9-5.4"/></svg>';}
function shieldSvg(){return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2l7 3v6c0 4.4-3 8.4-7 9.6C8 19.4 5 15.4 5 11V5l7-3zm-1.2 12.4l5.3-5.3-1.4-1.4-3.9 3.9-1.8-1.8-1.4 1.4 3.2 3.2z"/></svg>';}
function crownSvg(){return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M3 7.5l4.2 3.8L12 5l4.8 6.3L21 7.5V17H3z"/></svg>';}
window.ak47BadgeForCode=function(code){
  if(!code)return '';
  const r=userRec(code);const parts=[];
  if(isAdminCode(code))parts.push('<span class="ak47-badge ak47-badge-admin" title="'+escapeHtml(tt47('Администратор','Administrator'))+'">'+shieldSvg()+'</span>');
  if(r&&r.verified)parts.push('<span class="ak47-badge ak47-badge-verified" title="'+escapeHtml(tt47('Подтверждённый','Verified'))+'">'+verifiedSvg()+'</span>');
  if(r&&r.premium)parts.push('<span class="ak47-badge ak47-badge-premium" title="'+escapeHtml(tt47('Премиум','Premium'))+'">'+crownSvg()+'</span>');
  return parts.join('');
};

/* ---------- link previews ---------- */
function ytId(url){const m=String(url).match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/i);return m?m[1]:null;}
function escapeAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function linkPreview(text){
  const m=String(text||'').match(/https?:\/\/[^\s<>"')\]]+/i);if(!m)return '';
  const url=m[0];const id=ytId(url);
  if(id){
    return '<div class="ak47-link ak47-yt" data-ak47-yt="'+id+'" data-ak47-url="'+escapeAttr(url)+'"><div class="ak47-yt-thumb"><img src="https://img.youtube.com/vi/'+id+'/hqdefault.jpg" alt="YouTube" loading="lazy" onerror="this.closest(\'.ak47-link\').classList.add(\'ak47-err\')"><button class="ak47-yt-play" type="button" aria-label="Play">&#9654;</button></div><div class="ak47-yt-cap">'+escapeHtml('YouTube')+' · '+escapeHtml(id)+'</div></div>';
  }
  let host='';try{host=new URL(url).hostname.replace(/^www\./,'');}catch(e){host=url;}
  const fav='https://www.google.com/s2/favicons?domain='+encodeURIComponent(host)+'&sz=64';
  return '<div class="ak47-link ak47-card"><a href="'+escapeAttr(url)+'" target="_blank" rel="noopener"><img class="ak47-card-fav" src="'+fav+'" alt="" onerror="this.style.display=\'none\'"><span class="ak47-card-host">'+escapeHtml(host)+'</span></a><a class="ak47-card-url" href="'+escapeAttr(url)+'" target="_blank" rel="noopener">'+escapeHtml(url.length>48?url.slice(0,48)+'…':url)+'</a></div>';
}
window.ak47PlayYt=function(el){
  const id=el.dataset.ak47yt;if(!id||el.querySelector('iframe'))return;
  el.innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0" title="YouTube" allow="accelerometer;autoplay;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>';
};

/* ---------- renderMessage: link preview + letter card ---------- */
const baseRenderMessage=renderMessage;
renderMessage=function(message){
  let html=baseRenderMessage(message);
  if(message&&message.kind==='letter'){
    const head=icon('edit')+'<span>'+escapeHtml(tt47('Письмо','Letter'))+'</span>';
    html='<div class="message-row '+(message.sender==='me'?'mine':'theirs')+'"><div class="message-bubble"><div class="ak47-letter"><div class="ak47-letter-head">'+head+'</div>'+(message.text?'<div class="ak47-letter-body">'+escapeHtml(message.text)+'</div>':'')+(message.image?'<img class="ak47-letter-img" src="'+escapeHtml(message.image)+'" alt="">':'')+(message.subject?'<div class="ak47-letter-sub">'+escapeHtml(message.subject)+'</div>':'')+'</div><div class="message-meta"><span>'+formatTime(message.createdAt)+'</span></div></div></div>';
    return html;
  }
  if(message&&message.text){
    const prev=linkPreview(message.text);
    if(prev&&/<div class="message-meta">/.test(html))html=html.replace(/<div class="message-meta">/,prev+'<div class="message-meta">');
  }
  return html;
};

renderChatMenu=function(entity){

/* ---------- letter flow (step-by-step, skippable) ---------- */
const LETTER_STEPS=[
  {t:'Приветствие',d:'Начните письмо с тёплого приветствия — это задаёт тон.'},
  {t:'Содержание',d:'Опишите главное: по какому поводу письмо и что вы хотите передать.'},
  {t:'Фото',d:'Добавьте красивое фото, если хотите сделать письмо ярче (не обязательно).'},
  {t:'Отправка',d:'Нажмите «Отправить» — письмо улетит адресату в конверте.'}
];
let ak47LetterPhoto='';
window.ak47SendLetter=function(){
  if(!ui.selectedId)return;const entity=getEntity(ui.selectedId);if(!entity||!entity.contactCode||entity.bot){showToast(tt47('Письма можно отправить только контакту','Letters can be sent to a contact'),'','block');return;}
  let step=0;ak47LetterPhoto='';
  const formBody=`<div class="ak47-letter-form"><div class="field"><label>${escapeHtml(tt47('Тема (необязательно)','Subject (optional)'))}</label><input id="ak47-letter-sub" maxlength="80" placeholder="${escapeHtml(tt47('Например: С днём рождения!','For example: Happy birthday!'))}"></div><div class="field"><label>${escapeHtml(tt47('Текст письма','Letter text'))}</label><textarea id="ak47-letter-text" rows="5" maxlength="2000" placeholder="${escapeHtml(tt47('Напишите тёплые слова…','Write kind words…'))}"></textarea></div><label class="ak47-letter-photo" id="ak47-letter-photo-btn"><span>${icon('image')} ${escapeHtml(tt47('Добавить фото','Add a photo'))}</span><input id="ak47-letter-photo" type="file" accept="image/*" hidden></label></div>`;
  const stepBody=`<div style="text-align:center"><div class="ak47-env"><div class="ak47-env-body"></div><div class="ak47-env-seal">&#9829;</div><div class="ak47-env-flap"></div></div><div class="ak47-steps">${LETTER_STEPS.map((_,i)=>'<span class="ak47-step-dot" data-dot="'+i+'"></span>').join('')}</div><div class="ak47-step-title" id="ak47-step-title"></div><div class="ak47-step-text" id="ak47-step-text"></div><div class="ak47-modal-actions"><button class="secondary-btn" type="button" id="ak47-letter-skip">${escapeHtml(tt47('Пропустить','Skip'))}</button><button class="primary-btn" type="button" id="ak47-letter-next">${escapeHtml(tt47('Далее','Next'))}</button></div></div>`;
  let root=null;
  function paintStep(){
    document.querySelectorAll('.ak47-step-dot').forEach((d,i)=>d.classList.toggle('on',i===step));
    document.getElementById('ak47-step-title').textContent=LETTER_STEPS[step].t;
    document.getElementById('ak47-step-text').textContent=LETTER_STEPS[step].d;
    document.getElementById('ak47-letter-next').textContent=(step===LETTER_STEPS.length-1)?tt47('К письму','To the letter'):tt47('Далее','Next');
  }
  function showForm(){
    root.innerHTML=formBody;
    const file=root.querySelector('#ak47-letter-photo');
    file.addEventListener('change',()=>{
      const f=file.files&&file.files[0];if(!f)return;
      const rd=new FileReader();rd.onload=()=>{ak47LetterPhoto=String(rd.result);const b=root.querySelector('#ak47-letter-photo-btn');b.innerHTML='<img src="'+ak47LetterPhoto+'" alt=""> <span>'+escapeHtml(tt47('Заменить фото','Replace photo'))+'</span>';};
      rd.readAsDataURL(f);
    });
    root.querySelector('.ak47-modal-actions,.ak47-modal-actions')?.remove();
    root.insertAdjacentHTML('beforeend','<div class="ak47-modal-actions"><button class="secondary-btn" type="button" id="ak47-letter-back">'+escapeHtml(tt47('Назад','Back'))+'</button><button class="primary-btn" type="button" id="ak47-letter-send">'+icon('send')+' '+escapeHtml(tt47('Отправить письмо','Send letter'))+'</button></div>');
    root.querySelector('#ak47-letter-back').addEventListener('click',()=>{step=0;root.innerHTML=stepBody;wireSteps();paintStep();});
    root.querySelector('#ak47-letter-send').addEventListener('click',sendLetter);
  }
  function wireSteps(){
    root.querySelector('#ak47-letter-skip').addEventListener('click',showForm);
    root.querySelector('#ak47-letter-next').addEventListener('click',()=>{step<LETTER_STEPS.length-1?(step++,paintStep()):showForm();});
  }
  function sendLetter(){
    const text=(root.querySelector('#ak47-letter-text')?.value||'').trim();
    const subject=(root.querySelector('#ak47-letter-sub')?.value||'').trim();
    if(!text){showToast(tt47('Напишите текст письма','Write the letter text'),'','block');return;}
    closeModal();
    addMessage(entity.id,{sender:'me',kind:'letter',text,subject,image:ak47LetterPhoto||null,createdAt:nowIso()});
    akLive.post('/api/message',{entityId:entity.id,fromCode:myCode(),toCode:entity.contactCode,text:'[letter]'+text,kind:'letter'}).catch(()=>{});
    showToast(tt47('Письмо отправлено','Letter sent'),entity.title,'check');
    renderMain();
  }
  showModal({title:tt47('Новое письмо','New letter'),subtitle:escapeHtml(tt47('Адресат: '+entity.title,'To: '+entity.title)),body:stepBody,onReady(r){root=r;wireSteps();paintStep();}});
};
document.addEventListener('click',e=>{
  const b=e.target&&e.target.closest?e.target.closest('[data-chat-action="letter"]'):null;
  if(b){e.stopPropagation();window.ak47SendLetter();}
},true);

/* ---------- renderMain post-process: badges + YT play binding ---------- */
const baseRenderMain=renderMain;
renderMain=function(options){
  const r=baseRenderMain(options);
  try{ak47PostProcess();}catch(e){}
  return r;
};
function ak47PostProcess(){
  // chat head badge (selected chat)
  try{
    const strong=document.querySelector('.chat-title strong');
    if(strong){const entity=getEntity(ui.selectedId);if(entity&&entity.contactCode&&!entity.bot){const b=window.ak47BadgeForCode(entity.contactCode);if(b&&!strong.querySelector('.ak47-badge'))strong.insertAdjacentHTML('beforeend',b);}}
  }catch(e){}
  // sidebar list badges
  try{
    document.querySelectorAll('.entity-card[data-open-entity]').forEach(card=>{
      const id=card.dataset.openEntity;const entity=(state.entities||[]).find(e=>e.id===id);
      if(!entity||!entity.contactCode||entity.bot)return;
      const nameEl=card.querySelector('.entity-name');if(!nameEl||nameEl.querySelector('.ak47-badge'))return;
      const b=window.ak47BadgeForCode(entity.contactCode);if(b)nameEl.insertAdjacentHTML('beforeend',b);
    });
  }catch(e){}
  // bind YouTube play buttons
  try{
    document.querySelectorAll('.ak47-yt[data-ak47-yt]').forEach(el=>{
      if(el.dataset.ak47Bound)return;el.dataset.ak47Bound='1';
      const play=el.querySelector('.ak47-yt-play');if(play)play.addEventListener('click',ev=>{ev.stopPropagation();window.ak47PlayYt(el);});
      el.addEventListener('click',()=>{if(!el.querySelector('iframe'))window.ak47PlayYt(el);});
    });
  }catch(e){}
}
})();

    :'<div class="ak48-modal-actions"><button class="primary-btn" type="button" id="ak48-giftbtn">'+icon('gift')+' '+escapeHtml(tt('Подарить','Gift'))+'</button><button class="secondary-btn" type="button" data-close-modal>'+escapeHtml(tx('cancel'))+'</button></div>';
  const body='<div class="ak48-profile">'+avatarMarkup({title:u.name||code,avatar:u.avatar},'profile-avatar')+'<div class="ak48-p-name">'+escapeHtml(u.name||code)+window.ak47BadgeForCode(code)+window.ak48GiftBadges(code)+'</div><div class="ak48-p-code">'+escapeHtml(tt('Aqua-код','Aqua code'))+': <b>'+escapeHtml(code)+'</b></div><div class="ak48-pills">'+(pills.join('')||'<span style="color:var(--ink-soft);font-size:12px">'+escapeHtml(tt('Обычный пользователь','Regular user'))+'</span>')+'</div><div class="ak48-p-row"><span>'+icon('star')+' '+escapeHtml(tt('Баланс','Balance'))+'</span><b>'+stars.toLocaleString()+' ⭐</b></div><div class="ak48-p-row"><span>'+icon('gift')+' '+escapeHtml(tt('Подарки','Gifts'))+'</span><b>'+owned.length+'</b></div><div class="ak48-p-gifts">'+ownedHtml+'</div></div>'+actions;
  showModal({title:u.name||code,subtitle:tt('Профиль пользователя','User profile'),body:body,onReady(root){
    root.querySelectorAll('[data-close-modal]').forEach(b=>b.addEventListener('click',closeModal));
    const gb=root.querySelector('#ak48-giftbtn');
    if(gb)gb.addEventListener('click',()=>{const ent=getEntity(ui.selectedId);const target={contactCode:code,title:u.name||code};closeModal();window.ak48OpenGiftModal(ent&&ent.contactCode===code?ent:target);});
    const mg=root.querySelector('#ak48-manage');
    if(mg)mg.addEventListener('click',()=>{closeModal();window.ak48ManageMyGifts();});
    root.querySelectorAll('[data-ak48-own]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();if(!isMe)return;const id=el.dataset.ak48Own;window.ak48ToggleEquip(id);renderMain({preserveScroll:true});}));
  }});
};

/* ---- gift shop (stars + emojis + premium) ---- */
window.ak48OpenGiftModal=function(entity){
  if(!entity||!entity.contactCode){showToast(tt('Выберите контакт','Choose a contact'),'','block');return;}
  const toCode=entity.contactCode,toName=entity.title||toCode;
  const balance=Number(state.stars||0);
  const starsRow=[10,25,50,100].map(n=>'<button class="ak48-gift-card" type="button" data-ak48-stars="'+n+'"><span class="ak48-gift-e">⭐</span><span class="ak48-gift-n">'+n+'</span><span class="ak48-gift-p">'+escapeHtml(tt('звёзды','stars'))+'</span></button>').join('');
  const emojiGrid=Object.keys(AK48_GIFTS).map(id=>{const g=AK48_GIFTS[id];return '<button class="ak48-gift-card" type="button" data-ak48-emoji="'+id+'" data-ak48-price="'+g.p+'"><span class="ak48-gift-e '+g.a+'">'+g.e+'</span><span class="ak48-gift-n">'+escapeHtml(g.n)+'</span><span class="ak48-gift-p">⭐ '+g.p+'</span></button>';}).join('');
  const premiumCard='<button class="ak48-gift-card ak48-gift-premium" type="button" data-ak48-premium="1"><span class="ak48-gift-e ak48-b1">👑</span><span class="ak48-gift-n">'+escapeHtml(tt('Премиум · 1 мес.','Premium · 1 month'))+'</span><span class="ak48-gift-p">⭐ '+AK48_PREMIUM+'</span></button>';
  const body='<p style="margin:0 0 12px;color:var(--ink-soft);font-size:12.5px">'+escapeHtml(tt('Звёзды и премиум уходят получателю. Анимационные смайлики получатель сохранит себе и сможет повесить до 6 у профиля.','Stars and premium go to the recipient. Animated emojis are kept by the recipient and can be hung (up to 6) by the profile.'))+'</p><div class="ak48-gift-grid">'+starsRow+emojiGrid+premiumCard+'</div>';
  showModal({title:tt('Подарок','Gift'),subtitle:tx('balance')+': '+balance+'⭐ → '+escapeHtml(toName),body:body,actions:'<button class="secondary-btn" type="button" data-close-modal>'+escapeHtml(tx('cancel'))+'</button>',onReady(root){
    root.querySelectorAll('[data-close-modal]').forEach(b=>b.addEventListener('click',closeModal));
    root.querySelectorAll('[data-ak48-stars]').forEach(b=>b.addEventListener('click',()=>{
      const n=Number(b.dataset.ak48Stars);if(n>balance){showToast(tx('notEnoughStars'),'','star');return;}
      closeModal();akLive.post('/api/gift',{code:myCode(),toCode:toCode,amount:n,giftType:'stars'}).then(res=>{if(res&&res.ok===false)return;showToast(tt('Подарок отправлен ✓','Gift sent ✓'),'⭐ '+n+' → '+toName,'star');renderMain({preserveScroll:true});}).catch(()=>{});
    }));
    root.querySelectorAll('[data-ak48-emoji]').forEach(b=>b.addEventListener('click',()=>{
      const id=b.dataset.ak48Emoji,g=AK48_GIFTS[id];if(!g)return;if(g.p>balance){showToast(tx('notEnoughStars'),'','star');return;}
      closeModal();akLive.post('/api/gift',{code:myCode(),toCode:toCode,amount:g.p,giftType:'emoji',giftId:id}).then(res=>{if(res&&res.ok===false)return;showToast(tt('Подарок отправлен ✓','Gift sent ✓'),g.e+' '+g.n+' → '+toName,'star');renderMain({preserveScroll:true});}).catch(()=>{});
    }));
    const pm=root.querySelector('[data-ak48-premium]');
    if(pm)pm.addEventListener('click',()=>{
      if(AK48_PREMIUM>balance){showToast(tx('notEnoughStars'),'','star');return;}
      closeModal();akLive.post('/api/gift',{code:myCode(),toCode:toCode,amount:AK48_PREMIUM,giftType:'premium'}).then(res=>{if(res&&res.ok===false)return;showToast(tt('Премиум подарен ✓','Premium gifted ✓'),'👑 → '+toName,'star');renderMain({preserveScroll:true});}).catch(()=>{});
    });
  }});
};

/* ---- manage my own gifts (equip / sell) ---- */
window.ak48ToggleEquip=function(id){
  const u=myRec();const eq=equippedIds(u);const i=eq.indexOf(id);
  const next=(i>=0?eq.slice(0,i).concat(eq.slice(i+1)):eq.concat(id)).slice(0,6);
  akLive.post('/api/collectible',{action:'equip',equipped:next}).then(()=>{showToast(next.indexOf(id)>=0?tt('Подарок повешен у профиля','Badge equipped by profile'):tt('Снято с профиля','Removed from profile'),'','check');renderMain({preserveScroll:true});}).catch(()=>{});
};
window.ak48ManageMyGifts=function(){
  const u=myRec();const owned=ownedIds(u);const eq=equippedIds(u);
  if(!owned.length){showModal({title:tt('Мои подарки','My gifts'),body:'<p style="text-align:center;color:var(--ink-soft)">'+escapeHtml(tt('У вас пока нет подарков. Подарите или купите анимационный смайлик!','You have no gifts yet. Get or buy an animated emoji!'))+'</p>',actions:'<button class="secondary-btn" type="button" data-close-modal>'+escapeHtml(tx('ok'))+'</button>',onReady(r){r.querySelectorAll('[data-close-modal]').forEach(b=>b.addEventListener('click',closeModal));}});return;}
  const cards=owned.map(id=>{const g=AK48_GIFTS[id];if(!g)return '';const on=eq.indexOf(id)>=0;return '<div class="ak48-gift-card" style="cursor:default"><span class="ak48-gift-e '+g.a+'">'+g.e+'</span><span class="ak48-gift-n">'+escapeHtml(g.n)+'</span><div style="display:flex;gap:6px;margin-top:4px"><button class="small-btn" type="button" data-ak48-eq="'+id+'" data-on="'+(on?'1':'0')+'">'+escapeHtml(on?tt('Снять','Remove'):tt('Повесить','Equip'))+'</button><button class="small-btn" type="button" data-ak48-sell="'+id+'" data-price="'+g.p+'">'+escapeHtml(tt('Продать','Sell'))+' ⭐'+g.p+'</button></div></div>';}).join('');
  showModal({title:tt('Мои подарки','My gifts'),subtitle:tt('До 6 бейджей у профиля','Up to 6 badges by the profile'),body:'<div class="ak48-gift-grid">'+cards+'</div>',actions:'<button class="secondary-btn" type="button" data-close-modal>'+escapeHtml(tx('close'))+'</button>',onReady(root){
    root.querySelectorAll('[data-close-modal]').forEach(b=>b.addEventListener('click',closeModal));
    root.querySelectorAll('[data-ak48-eq]').forEach(b=>b.addEventListener('click',()=>{window.ak48ToggleEquip(b.dataset.ak48Eq);}));
    root.querySelectorAll('[data-ak48-sell]').forEach(b=>b.addEventListener('click',()=>{
      const id=b.dataset.ak48Sell,price=Number(b.dataset.price);
      akLive.post('/api/collectible',{action:'sell',id:id,price:price}).then(res=>{if(res&&res.ok===false)return;closeModal();showToast(tt('Продано','Sold'),'⭐ +'+price,'star');renderMain({preserveScroll:true});}).catch(()=>{});
    }));
  }});
};

/* ---- chat menu: "Profile" item + richer "gift" interception ---- */
const baseRenderChatMenu=renderChatMenu;
renderChatMenu=function(entity){
  let html=baseRenderChatMenu(entity);
  if(entity&&entity.contactCode&&!entity.bot){
    const prof='<button class="menu-item" type="button" data-chat-action="profile48">'+icon('user')+'<span>'+escapeHtml(tt('Профиль','Profile'))+'</span></button>';
    html=html.replace(/<\/div>\s*$/,prof+'</div>');
  }
  return html;
};
document.addEventListener('click',e=>{
  const t=e.target&&e.target.closest;
  const pb=t?e.target.closest('[data-chat-action="profile48"]'):null;
  if(pb){e.stopPropagation();const ent=getEntity(ui.selectedId);if(ent&&ent.contactCode)window.ak48OpenUserProfile(ent.contactCode);return;}
  const gb=t?e.target.closest('[data-chat-action="gift"]'):null;
  if(gb){const ent=getEntity(ui.selectedId);if(ent&&ent.contactCode&&!ent.bot){e.stopPropagation();window.ak48OpenGiftModal(ent);}}
},true);

/* ---- renderMain post-process: gift badges by profile (chat head + sidebar brand) ---- */
const baseRenderMain=renderMain;
renderMain=function(options){
  const r=baseRenderMain(options);
  try{ak48PostProcess();}catch(e){}
  return r;
};
function ak48PostProcess(){
  try{
    const strong=document.querySelector('.chat-title strong');
    if(strong){const ent=getEntity(ui.selectedId);if(ent&&ent.contactCode&&!ent.bot){const b=window.ak48GiftBadges(ent.contactCode);if(b&&!strong.querySelector('.ak48-badge'))strong.insertAdjacentHTML('beforeend',b);}}
  }catch(e){}
  try{
    const brand=document.querySelector('.sidebar-head .account-line');
    if(brand){const b=window.ak48GiftBadges(myCode());if(b&&!brand.querySelector('.ak48-badge'))brand.insertAdjacentHTML('beforeend',b);}
  }catch(e){}
}
})();

setTimeout(()=>{if(sessionAuthenticated)renderMain();},2600);

  </script>
